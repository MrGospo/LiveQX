openapi: 3.1.0

# ─────────────────────────────────────────────────────────────────────────────
# Streaming Core — REST API contract.
#
# Это формальный контракт REST-поверхности LiveQX, который потребляет
# веб-UI (см. docs/ux/ui-spec.md). Контракт собран из реального кода
# src/api/ControlApi.cpp + src/api/MetricsApi.cpp + src/api/HealthApi.cpp,
# и должен оставаться в синхроне с ним.
#
# Заполнение по доменам (fix24):
#
#   • c11 — этот скелет: header, server, security, tags, common components,
#     общие параметры. Paths пустые.
#   • c12 — auth + users + audit + ldap + smtp.
#   • c13 — channels + playlist + schedule + playback-log.
#   • c14 — outputs + inputs + watcher + preview.
#   • c15 — gateways + system + plugins + stress + perf + events + healthz.
#   • c16 — валидация: openapi-spec-validator (3.1.0 schema) clean,
#     все 88 endpoints в ControlApi.cpp 1:1 покрыты в paths,
#     lint clean (summary/tags/2xx response у каждой операции,
#     type/composition keyword у каждой schema).
#
# ─────────────────────────────────────────────────────────────────────────────

info:
  title: Streaming Core REST API
  version: 1.0.0
  summary: |
    Управление и наблюдение за headless-ядром LiveQX: каналы,
    playlist, schedule, multi-output, live-input, gateways, plugins,
    наблюдаемость, RBAC + LDAP, профайлер, стресс-раннер.
  description: |
    Полный сервис-контракт. Все endpoints, кроме `/api/auth/login`,
    `/healthz`, `/livez`, `/readyz` и `GET /api/version`, требуют
    `Authorization: Bearer <jwt>` заголовок.

    ## Роли (RBAC)

    Иерархия: `viewer < operator < admin`. Решение принимает `AuthService`
    в pre-handler'е `ControlApi` (см. docs/AUTH.md).

    Дополнительно у каждого пользователя есть набор **per-channel grants**
    (`view` или `operate`). Operator/Admin без явного grant не теряют доступ
    к каналу (роль перевешивает); viewer без grant'а не видит канал в выдаче
    `/api/channels` и получает 404 на `/api/channels/{id}/*`.

    ## Формат ошибок

    Все 4xx/5xx ответы имеют единое тело:

    ```json
    { "error": "snake_case_code", "detail": "human-readable optional" }
    ```

    Конкретные коды перечислены в `Error` schema. Неизвестные коды клиент
    ДОЛЖЕН трактовать как `unknown_error` и показывать `detail`.

    ## Real-time

    Server-Sent Events: `GET /api/events/stream` с поддержкой
    `Last-Event-ID` для re-attach. WebRTC preview: `POST /api/channels/{id}/preview/offer`
    + `DELETE /api/channels/{id}/preview/{session_id}`. См. docs/UI_API.md.

  contact:
    name: LiveQX
    url: https://github.com/MrGos/liveqx
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: http://{host}:{port}
    description: Self-hosted instance (default 0.0.0.0:8080)
    variables:
      host:
        default: localhost
        description: Bind host
      port:
        default: "8080"
        description: HTTP port (см. config.json `http.port`)

# ─────────────────────────────────────────────────────────────────────────────
# Security: глобально требуем bearerAuth, отключаем точечно через `security: []`
# в конкретных публичных операциях (login, health, version).
# ─────────────────────────────────────────────────────────────────────────────

security:
  - bearerAuth: []

# ─────────────────────────────────────────────────────────────────────────────
# Tags = домены UI (см. docs/ux/ui-spec.md § 2 IA).
# ─────────────────────────────────────────────────────────────────────────────

tags:
  - name: Auth
    description: |
      Логин, refresh, force-change-password, текущая сессия. Endpoints этого
      тега единственные, где security не обязателен (login + refresh
      используют свой credential flow).
  - name: Users
    description: |
      Управление учётками (admin only). CRUD + role + per-channel grants
      + unlock + reset password. LDAP-юзеры read-only, кроме role/grants.
  - name: Audit
    description: |
      Журнал security-событий (login.ok, login.fail, user.create, plugin.install,
      …). Только admin. Поддерживает фильтры и пагинацию.
  - name: LDAP
    description: |
      Конфиг LDAP (server/bind/search/group→role). Test-bind. Hot-reload
      при PUT — текущие сессии не инвалидируются.
  - name: SMTP
    description: |
      Конфиг SMTP. Test-send. Используется для нотификаций (резерв на будущее);
      core flow рассылок в MVP отсутствует.
  - name: Channels
    description: |
      CRUD каналов, hot-reload части полей, requires_restart на остальных.
      Включает `start`/`stop` и `state` snapshot.
  - name: Playlist
    description: |
      Управление playlist'ом канала: append/replace/insert/remove/swap.
      Hot-swap во время вещания.
  - name: Schedule
    description: |
      Per-channel schedule: once/daily/weekly/monthly entries с приоритетами.
      Hot-reload через PUT.
  - name: PlaybackLog
    description: |
      Журнал boundary-событий (clip start/end) для аудита что и когда играло.
  - name: Outputs
    description: |
      Multi-output panel: srt/multicast/rtmp/hls/ndi на канал. Hot-add/remove/patch.
      Per-output status drawer.
  - name: Inputs
    description: |
      Управление live-input clip'ами в playlist (multicast/rtmp/rtsp/ndi).
      Inputs — это специальный вид playlist entry; см. tag Playlist для CRUD.
  - name: Watcher
    description: |
      ContentSync folder watcher: status, manual rescan.
  - name: Preview
    description: |
      WebRTC low-bitrate per-channel preview. Offer/answer + delete сессии.
      Gated `features.preview` в `/api/version`.
  - name: Gateways
    description: |
      Packet-level UDP/multicast forwarders, не связанные с каналами.
      CRUD + start/stop + status.
  - name: System
    description: |
      Системная информация: интерфейсы, GPU, NUMA, build info, версия.
  - name: Plugins
    description: |
      Управление плагинами (NDI и будущие). List/install/uninstall + manifest.
  - name: Stress
    description: |
      Запуск/остановка стресс-сценариев + история отчётов + cron-расписание.
  - name: Perf
    description: |
      Per-channel профайлер (Off/Sampling/Instrumentation). Snapshot + start/stop.
  - name: Metrics
    description: |
      Prometheus surface (`/api/metrics`) + JSON `/api/status`.
  - name: Events
    description: |
      Server-Sent Events для UI. Один endpoint, поддержка `Last-Event-ID`.
  - name: Health
    description: |
      Liveness/readiness/healthz probes. Не требуют auth.
  - name: TLS
    description: |
      Управление TLS-сертификатами control-plane (fix38). Admin only.
      Четыре режима (см. docs/TLS.md): `auto` (внутренний CA + server cert,
      авто-выпуск при первом старте), `provided` (admin загрузил cert+key
      через `/api/tls/import` или положил файлы вручную), `behind_proxy`
      (TLS терминируется на reverse proxy — core слушает plain HTTP), и
      `disabled`. Hot-reload listener'а (rebind на новый cert+key)
      выполняется автоматически после `regenerate-server` / `import`.

# ─────────────────────────────────────────────────────────────────────────────
# Paths
# ─────────────────────────────────────────────────────────────────────────────

paths:

  # ──────────────────────────────────────────────────────────────────────────
  # Auth
  # ──────────────────────────────────────────────────────────────────────────

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login with username/password
      description: |
        Public endpoint (security: []). Возвращает JWT pair (access + refresh)
        + краткое описание юзера. Реальный механизм бэкенда:

        * Local-юзеры — Argon2id verify в auth.db.
        * LDAP-юзеры — `simple_bind` против сервера; row создаётся при первом успехе.
        * Suite admin (`mode == master`) — verify через master.key.

        UserNotFound и InvalidPassword одинаково маскируются под
        `invalid_credentials` (никаких enumeration leaks).

        После N последовательных провалов учётка local-юзера временно
        блокируется (`account_locked`, 423). Окно блокировки — до
        `locked_until` (см. /api/auth/users/{id}).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Successful authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Missing credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: |
            Учётка disabled (`user_disabled`) или истёк initial password
            (`initial_password_expired`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange refresh token for new pair
      description: |
        Refresh token однократно используем (rotation): сервер выдаёт новую
        пару и инвалидирует старый refresh. Если refresh не валиден / уже
        использован / срок истёк — 401.

        LDAP-кэш групп: при `recheck_groups_on_refresh=true` при refresh'е
        пересчитывается роль и channel_grants по directory. При downtime
        LDAP — error `ldap_cache_expired`, status 401: клиент должен
        перелогиниться.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refresh_token]
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Refresh successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: User disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke current session
      description: |
        Берёт access-token из Authorization header, верифицирует, достаёт
        `jti` и помечает сессию как revoked. Отдельный refresh не
        требуется — он умрёт вместе с jti.
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [logged_out]
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user
      description: |
        Возвращает текущего юзера (по JWT) — UI Profile-странице нужны
        email, last_login_at, last_login_ip. `/api/auth/users/{id}`
        Admin-only, поэтому viewer/operator получают свой профиль
        исключительно через этот endpoint.
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Юзер удалён за время жизни access-токена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me/password:
    post:
      tags: [Auth]
      summary: Self-change password
      description: |
        Доступен **всегда** для аутентифицированного юзера, в том числе
        с `must_change_password=true` (force-change-flow). Это
        whitelist-исключение в RBAC pre-handler'е.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 8
      responses:
        '200':
          description: Password changed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [password_changed]
        '400':
          description: |
            Поле отсутствует, или новый пароль слишком слабый
            (`new_password_weak`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            User disabled или `current_password_wrong`. UI показывает
            inline-error на поле «Текущий пароль».
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ──────────────────────────────────────────────────────────────────────────
  # Own sessions (fix32 B2): Profile/Sessions page
  # ──────────────────────────────────────────────────────────────────────────

  /api/auth/me/sessions:
    get:
      tags: [Auth]
      summary: List active sessions of current user
      description: |
        Возвращает только активные (не revoked, expires_at в будущем)
        сессии текущего юзера. **Никогда** чужие — даже Admin не видит
        чужие сессии через этот endpoint (для админских целей нужен
        отдельный list, пока не реализован). Поле `current` отмечает
        сессию, через чей access_token пришёл запрос (по `jti` claim).

        Сортировка: по `last_seen_at DESC NULLS LAST`, потом
        `created_at DESC` — самая активная сверху.
      responses:
        '200':
          description: Active sessions list.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OwnSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          description: AuthService not configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/me/sessions/{jwt_id}:
    delete:
      tags: [Auth]
      summary: Revoke a session of current user
      description: |
        Идемпотентный revoke. Пользователь может ревокать только свои
        сессии (фильтр user_id в SQL). Если ревокается **текущая**
        сессия — следующий запрос с её access_token вернёт 401, и UI
        делает logout. Поле `current` в ответе подтверждает, был ли
        revoke текущей сессии.

        404 возвращается если jwt_id не существует, принадлежит другому
        юзеру, или уже был revoked — без раскрытия, какой из вариантов
        (предотвращение enumeration).
      parameters:
        - in: path
          name: jwt_id
          required: true
          schema:
            type: string
            description: |
              URL-safe base64 без padding. Регистрозависимо.
      responses:
        '200':
          description: Session revoked.
          content:
            application/json:
              schema:
                type: object
                required: [status, jwt_id, current]
                properties:
                  status:
                    type: string
                    enum: [revoked]
                  jwt_id:
                    type: string
                  current:
                    type: boolean
                    description: |
                      true если revoke ревокнул сессию, через которую
                      пришёл запрос. UI делает logout в этом случае.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: |
            Session не найдена, чужая, или уже revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/auth/master-key/info:
    get:
      tags: [Auth]
      summary: Master-key metadata (admin)
      description: |
        Возвращает безопасную к показу metadata мастер-ключа: короткий
        fingerprint (sha256-prefix), алгоритм шифрования, источник
        (`file` или `env`), время создания и последней ротации.
        Сам ключ никогда не возвращается. Admin only — RBAC отрезает
        non-admin до handler'а.

        UI показывает эти поля в Settings/MasterKey, чтобы оператор
        мог сверить fingerprint с ожидаемым (например, после rotate
        через CLI). `last_rotated_at` берётся из mtime последнего
        `master.key.<unix-sec>.bak` в state-dir.
      responses:
        '200':
          description: Master-key metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MasterKeyInfo'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: |
            Auth-стек не инициализирован (master-key недоступен).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Users (admin)
  # ──────────────────────────────────────────────────────────────────────────

  /api/auth/users:
    get:
      tags: [Users]
      summary: List all users
      description: Admin-only. Включает disabled-юзеров.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [users]
                properties:
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Users]
      summary: Create user
      description: |
        Admin-only. Если password не указан — сервер генерирует случайный
        и возвращает в `initial_password` (один раз). Auto-set
        `must_change_password=true`. LDAP-юзеры через этот endpoint
        не создаются — они появляются при первом login'е.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username]
              properties:
                username:
                  type: string
                  pattern: '^[a-zA-Z0-9._-]+$'
                  minLength: 1
                  maxLength: 64
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                role:
                  $ref: '#/components/schemas/Role'
                must_change_password:
                  type: boolean
                  default: true
      responses:
        '201':
          description: User created.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/User'
                  - type: object
                    properties:
                      initial_password:
                        type: string
                        description: |
                          Plaintext одноразовый initial password. Возвращается
                          ТОЛЬКО если auto-generated (admin не передал
                          `password` в body). Admin обязан показать его
                          пользователю один раз.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Username taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user detail
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Users]
      summary: Update user (role, email, source)
      description: |
        Patch-семантика: пропущенные поля сохраняют прежние значения.
        Username **не редактируется** — только удаление+создание.
        Source меняется только в редких случаях миграции (local↔ldap);
        admin должен быть осторожен — local password при switch на ldap
        теряется.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
                source:
                  $ref: '#/components/schemas/Source'
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Disable user (soft delete)
      description: |
        Set `disabled=true`. Активные сессии **не** инвалидируются
        автоматически — следующая попытка refresh отдаст 403
        `user_disabled`. Если нужна немедленная отмена — admin
        может revoke session'ы вручную через `/api/auth/users/{id}/sessions`
        (TODO в backend, см. Appendix D).
      responses:
        '200':
          description: User disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [disabled]
                  id:
                    type: integer
                    format: int64
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/users/{user_id}/enable:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Re-enable user
      responses:
        '200':
          description: User enabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [enabled]
                  id:
                    type: integer
                    format: int64
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/users/{user_id}/reset-password:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Generate new initial password
      description: |
        Admin force-resets local password. Auto-set `must_change_password=true`
        и `initial_password_expires_at` через TTL. Plaintext возвращается ОДИН
        РАЗ — больше нигде он не материализуется.
      responses:
        '200':
          description: Password reset.
          content:
            application/json:
              schema:
                type: object
                required: [status, id, initial_password]
                properties:
                  status:
                    type: string
                    enum: [password_reset]
                  id:
                    type: integer
                    format: int64
                  initial_password:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/users/{user_id}/unlock:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Clear brute-force lockout
      description: |
        Идемпотентно: на чистом юзере вернёт 200 без изменений. Сбрасывает
        `failed_login_count=0` и `locked_until=NULL`.
      responses:
        '200':
          description: Unlocked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unlocked]
                  id:
                    type: integer
                    format: int64
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/users/{user_id}/purge:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Hard-delete user (irreversible)
      description: |
        Физически удаляет users-row + дочерние записи (sessions,
        channel_permissions, password_resets). Self-FK в users.created_by /
        ldap_config.updated_by / smtp_config.updated_by обнуляются.
        auth_audit-записи СОХРАНЯЮТСЯ (там username хранится snapshot'ом),
        включая запись `admin.user.purged` об этом действии.

        Отказы:
          * 409 `cannot_delete_self` — нельзя удалить собственную учётку
          * 409 `last_admin` — единственный non-disabled admin
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                required: [status, id]
                properties:
                  status:
                    type: string
                    enum: [purged]
                  id:
                    type: integer
                    format: int64
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Self-purge или last admin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/users/{user_id}/channels:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List per-channel grants for user
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelPermissionRow'
        '400':
          description: |
            User source mismatch (LDAP-юзеры через этот endpoint не
            редактируются — их grants приходят из directory).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/auth/users/{user_id}/channels/{channel_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
      - name: channel_id
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    put:
      tags: [Users]
      summary: Set channel grant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [permission]
              properties:
                permission:
                  $ref: '#/components/schemas/ChannelPermission'
      responses:
        '200':
          description: Grant set.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                    format: int64
                  channel_id:
                    type: integer
                    format: int64
                  permission:
                    $ref: '#/components/schemas/ChannelPermission'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Users]
      summary: Remove channel grant
      responses:
        '200':
          description: Grant removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: boolean
                  user_id:
                    type: integer
                    format: int64
                  channel_id:
                    type: integer
                    format: int64
        '404':
          description: User not found OR grant not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Audit
  # ──────────────────────────────────────────────────────────────────────────

  /api/auth/audit:
    get:
      tags: [Audit]
      summary: List audit events
      description: |
        Admin-only. Поддерживает фильтры (date range, user_id, username
        exact, event exact) и пагинацию (limit max 1000, offset).

        `details` — структурированный объект (бэкенд парсит хранящийся
        JSON-string обратно перед отдачей). При невалидном JSON — `details_raw`
        со строкой.
      parameters:
        - name: from_ts
          in: query
          required: false
          description: Unix timestamp (sec). Включительно.
          schema:
            type: integer
            format: int64
        - name: to_ts
          in: query
          required: false
          description: Unix timestamp (sec). Эксклюзивно.
          schema:
            type: integer
            format: int64
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
            format: int64
        - name: username
          in: query
          required: false
          description: Exact match.
          schema:
            type: string
        - name: event
          in: query
          required: false
          description: Exact match snake-case кода (login.ok, login.fail, …).
          schema:
            type: string
        - $ref: '#/components/parameters/LimitParam'
        - $ref: '#/components/parameters/OffsetParam'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditEvent'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/auth/audit/purge:
    post:
      tags: [Audit]
      summary: Purge old audit events
      description: |
        Удаляет записи старше `older_than_days`. Сама операция логируется
        как `audit.purged`.
      parameters:
        - name: older_than_days
          in: query
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: Purged.
          content:
            application/json:
              schema:
                type: object
                properties:
                  removed:
                    type: integer
                  older_than_days:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'

  # ──────────────────────────────────────────────────────────────────────────
  # LDAP
  # ──────────────────────────────────────────────────────────────────────────

  /api/auth/ldap/config:
    get:
      tags: [LDAP]
      summary: Get LDAP configuration
      description: |
        Admin-only. Если конфиг не сохранён — возвращает `{ "configured": false }`.
        `bind_password` всегда маскируется (`"***"` если задан, `""` если нет).
        Поле `bind_password_set: true|false` помогает UI решать показывать ли
        опцию «Change password».
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapConfig'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [LDAP]
      summary: Update LDAP configuration
      description: |
        Patch-семантика. **Password handling:**
        - `bind_password` отсутствует → сохраняется текущий.
        - `bind_password: ""` → игнорируется (UI «не трогать»).
        - `bind_password: "real"` → сохраняется новое значение.
        - `bind_password_unset: true` → явный clear (anonymous bind).

        Если `enabled=true` — конфиг проходит `LdapClient::validate()`;
        `enabled=false` сохраняется без validate (admin сейчас отключает).

        Hot-reload: AuthService::onLdapConfigChange пересчитывает
        активные клиенты. Существующие sessions НЕ инвалидируются.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapConfigRequest'
      responses:
        '200':
          description: Updated config (with masked password).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/ldap/test:
    post:
      tags: [LDAP]
      summary: Test LDAP connectivity / bind
      description: |
        Read-only probe. Ничего не пишет в БД (кроме audit-event
        `admin.ldap.test`).

        Body — все поля опциональны:
        - `use_saved` (default true) — берётся текущий конфиг как база.
        - `username` + `password` — если **оба** непустые, гоним
          `LdapClient::authenticate` с пересчётом mapped_role и grants.
          Иначе только ping.
        - Override-fields совпадают с PUT (server, tls_mode, base_dn, …).
          `bind_password: ""` игнорируется.

        Endpoint форсирует `enabled=true` перед `validate()` —
        admin тестит до save'а.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LdapTestRequest'
      responses:
        '200':
          description: Probe result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LdapTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ──────────────────────────────────────────────────────────────────────────
  # SMTP
  # ──────────────────────────────────────────────────────────────────────────

  /api/auth/smtp/config:
    get:
      tags: [SMTP]
      summary: Get SMTP configuration
      description: |
        Admin-only. `password` write-only — поле `password_set: bool`
        сообщает UI задан ли он.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpConfig'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [SMTP]
      summary: Update SMTP configuration
      description: |
        Patch. Password handling:
        - отсутствует → сохраняется текущий.
        - `password: ""` → явный delete.
        - `password: "real"` → новое значение.

        Validate если `enabled=true`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpConfigRequest'
      responses:
        '200':
          description: Updated config.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpConfig'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/auth/smtp/test:
    post:
      tags: [SMTP]
      summary: Send test email
      description: |
        Реально шлёт письмо. `to` обязателен (валидируется
        `SmtpClient::isPlausibleEmail`). `use_saved=true` (default) —
        берётся сохранённый config как база; override полей возможен.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SmtpTestRequest'
      responses:
        '200':
          description: Send result (включая ok=false с error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SmtpTestResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  # ──────────────────────────────────────────────────────────────────────────
  # Channels
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels:
    get:
      tags: [Channels]
      summary: List channels
      description: |
        Возвращает массив каналов, видимых текущему пользователю. RBAC:
        viewer без grant'а на канал — канал не виден; operator/admin —
        видят все. Для каждого канала возвращается snapshot status
        (state, current clip, fps, audio levels, output health и т.д.).
        Точная shape — см. ChannelStatus.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChannelStatus'
    post:
      tags: [Channels]
      summary: Create channel
      description: |
        Operator+. Body — полный ChannelConfig (см. docs/CHANNEL_LAYOUT.md
        для exhaustive list полей). Required minimum: `name`. После
        создания канал в состоянии `stopped` — нужен `POST /play` для запуска.

        Папка `channels/ch{id}-{sanitized_name}/` создаётся атомарно;
        config.json пишется через `.tmp` rename. Имя immutable —
        переименование == пересоздание.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConfigRequest'
      responses:
        '201':
          description: Channel created.
          content:
            application/json:
              schema:
                type: object
                required: [id]
                properties:
                  id:
                    type: integer
                    minimum: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Channel name conflict.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Channels]
      summary: Get channel status snapshot
      description: |
        Полный snapshot: state, current clip, transition phase, fps, audio
        peak/rms, output statuses (health summary, per-output fields),
        live-input badges, health verdict, last-state-change ts. Эта же
        форма публикуется как `ChannelStateChange` в SSE при смене state'а.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Channels]
      summary: Delete channel
      description: |
        Admin only. Останавливает канал если running, отвязывает StatePersistence,
        удаляет per-channel state.db и recording metadata, удаляет
        `channels/ch{id}-…/` директорию. **Необратимо.**
      responses:
        '204':
          description: Deleted.
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Channel still running — stop first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/config:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    put:
      tags: [Channels]
      summary: Update channel config (hot-patch where possible)
      description: |
        Patch. **`name` immutable** — попытка указать его → 400.

        Hot-reloadable поля (применяются мгновенно): `default_photo_duration`,
        `audio.target_lufs`, ряд параметров transition'ов и т.д.

        Поля, требующие рестарта: `numa_node`, ширина/высота/fps вывода,
        encoder_mode/gpu_index, любая смена audio sample rate. На таком
        запросе вернётся 409 `requires_restart` с `detail` указывающим
        какие поля затронуты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChannelConfigPatch'
      responses:
        '200':
          description: Updated channel status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            requires_restart — admin должен сначала stop канал, обновить
            конфиг, затем start. UI показывает чёткий warning перед действием.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/play:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Channels]
      summary: Start (or resume) channel
      description: |
        Operator+. Если канал в `stopped` — запускает render-loop и output-pumps.
        Если в `paused` — resumes. Иначе 409.
      responses:
        '200':
          description: Started — returns updated status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/channels/{id}/stop:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Channels]
      summary: Stop channel
      description: |
        Operator+. Перевод в `stopped` через `stopping`. State.db фиксирует
        событие как `stop:user`; на следующем старте application restart'а
        канал поднимется в `stopped` (а не auto-resume).
      responses:
        '200':
          description: Stopped — returns updated status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChannelStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /api/channels/{id}/next:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Channels]
      summary: Skip to next playlist item
      description: |
        Operator+. Прерывает текущий клип. Если активен schedule — переход
        учитывает priority (см. docs/SCHEDULE.md). Возвращает только `ok:true`
        — full status потом получает SSE-эвент `ClipChange`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum: [true]
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  # ──────────────────────────────────────────────────────────────────────────
  # Playlist
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/playlist:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Playlist]
      summary: Get playlist
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Playlist]
      summary: Replace playlist (atomic hot-swap)
      description: |
        Body — полный массив entries. Сервер парсит через
        `playlist::parsePlaylist`; на первой невалидной entry возвращает
        400 с `playlist[N]: …` сообщением. Live-entry id'ы должны быть
        unique в рамках playlist (нужно для `/live-status` lookup).

        Hot-swap: текущий клип доигрывает (если допустимо), затем cursor
        переходит на новый playlist по identity-anchored правилу
        (см. docs/CHANNEL_LAYOUT.md fix3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Playlist'
      responses:
        '200':
          description: Updated playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Playlist]
      summary: Clear playlist
      description: |
        Operator+. Срезает все entries. Если канал running — переход на
        FallbackClip; если schedule активен — следует приоритету.
      responses:
        '204':
          description: Cleared.
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/playlist/append:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Playlist]
      summary: Append entries to playlist
      description: |
        Body — массив entries для добавления в конец. Возвращает индекс
        первой добавленной + полный playlist.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Playlist'
      responses:
        '200':
          description: Appended.
          content:
            application/json:
              schema:
                type: object
                properties:
                  first_idx:
                    type: integer
                    minimum: 0
                  playlist:
                    $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/playlist/{idx}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: idx
        in: path
        required: true
        description: Zero-based playlist index.
        schema:
          type: integer
          minimum: 0
    delete:
      tags: [Playlist]
      summary: Remove entry by index
      description: |
        Если entry активен сейчас — `was_active=true` в ответе и канал
        переходит на следующий клип / schedule active. Cursor handling
        смотри в docs/CHANNEL_LAYOUT.md (fix3 stateful cursor).
      responses:
        '200':
          description: Removed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  was_active:
                    type: boolean
                  playlist:
                    $ref: '#/components/schemas/Playlist'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/playlist/notify-deleted:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Playlist]
      summary: Inform channel that a media file was deleted on disk
      description: |
        Используется ContentSync watcher'ом и admin'ом вручную для
        каналов с passthrough mode (нет watcher). Канал помечает все
        entries с этим path как broken; если активен сейчас — crossfade
        на FallbackClip.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path:
                  type: string
                  description: Absolute path к удалённому файлу.
      responses:
        '200':
          description: ok — returns updated playlist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/permissions:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Channels]
      summary: List per-channel ACL (mirror of users/{uid}/channels)
      description: |
        Admin-only. Возвращает кто из юзеров имеет какой permission на
        канале. Используется в Channel Detail → Permissions tab для
        быстрого «кто видит» обзора без обхода всех users.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id:
                    type: integer
                    format: int64
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChannelPermissionRow'
        '400':
          $ref: '#/components/responses/BadRequest'

  # ──────────────────────────────────────────────────────────────────────────
  # Schedule
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/schedule:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Schedule]
      summary: Get channel schedule
      description: |
        Список schedule entries (once / daily / weekly / monthly). Каждый
        entry имеет приоритет 0-1000 и опциональные `effective_from`/`effective_to`
        окна. Полная семантика — docs/SCHEDULE.md.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Schedule]
      summary: Replace schedule (hot-reload)
      description: |
        Operator+. Body — полный массив entries. Сервер validate'ит
        cron-выражения (для daily/weekly/monthly) и rejects на первой
        невалидной с 400.

        Hot-reload: новый schedule сразу вступает в силу. Active entry
        пересчитывается на следующем 1Hz tick'е (см. SCHEDULE.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Schedule'
      responses:
        '200':
          description: Updated schedule.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/schedule/active:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Schedule]
      summary: Currently-active schedule entry (if any)
      description: |
        Если `active.entry_id` отсутствует — schedule сейчас не активен;
        канал играет playlist. Если `active.entry_id` присутствует —
        то это победивший по приоритету entry.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleActive'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/schedule/upcoming:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: within_sec
        in: query
        required: false
        description: |
          Окно (default 3600). Server-side clamp [0, 30 * 86400].
        schema:
          type: integer
          minimum: 0
          maximum: 2592000
          default: 3600
    get:
      tags: [Schedule]
      summary: Upcoming schedule entries within window
      description: |
        Возвращает массив (всегда массив, может быть пустой) entries,
        которые сработают в окно [now, now+within_sec], ОТСОРТИРОВАНО по
        старту, с применением приоритета (низший приоритет в перекрытом
        окне исключается).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScheduleUpcomingItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────────
  # Playback log
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/playback-log/status:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [PlaybackLog]
      summary: Playback log sink status
      description: |
        Тип sink'а (`none`/`file`/`sqlite`), путь, размер БД, колчество
        записей, last_event_ts. Используется в Channel Detail → Log tab
        для понимания что вообще логируется.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackLogStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/playback-log:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: from_ns
        in: query
        required: false
        description: 'Unix timestamp в наносекундах. Включительно.'
        schema:
          type: integer
          format: int64
      - name: to_ns
        in: query
        required: false
        description: 'Unix timestamp в наносекундах. Эксклюзивно.'
        schema:
          type: integer
          format: int64
      - name: after_ns
        in: query
        required: false
        description: |
          Cursor-based pagination: только события после этого ts. Удобнее
          чем offset когда события постоянно дописываются.
        schema:
          type: integer
          format: int64
      - $ref: '#/components/parameters/LimitParam'
      - $ref: '#/components/parameters/OffsetParam'
    get:
      tags: [PlaybackLog]
      summary: Query playback log
      description: |
        Возвращает массив clip-boundary событий. Sink'и `none` отдают
        пустой массив с `truncated:false`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackLogResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────────
  # Outputs
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/outputs:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Outputs]
      summary: List outputs of channel
      description: |
        Каждый канал может иметь N outputs (типы: srt/multicast/rtmp/hls/ndi).
        Возвращает массив с status'ом каждого. NDI доступен только если
        plugin установлен и enabled.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputList'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Outputs]
      summary: Add output (hot-add)
      description: |
        Operator+ + per-channel `operate` grant. Body — OutputConfig
        с обязательным `id` и `type`. id должен быть уникален в рамках
        канала. Hot-add: pump-thread поднимается мгновенно, без рестарта
        канала.

        Discriminated union: точная shape body зависит от `type`. См.
        OutputConfig.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutputConfig'
      responses:
        '201':
          description: ok — returns full outputs list (включая новый).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputList'
        '400':
          description: Validation failed (missing fields, bad address, …).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Output id уже существует на этом канале.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Type-specific семантическая ошибка (например, NDI plugin не загружен).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/outputs/{output_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/OutputId'
    delete:
      tags: [Outputs]
      summary: Remove output
      description: |
        Hot-remove: pump-thread останавливается, ресурсы (socket, FD)
        освобождаются. Возвращает обновлённый список outputs.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputList'
        '404':
          description: Channel или output не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Outputs]
      summary: Hot-patch output (safe-subset only)
      description: |
        Patch только safe-subset полей (зависит от типа). Например:

        - **srt**: `latency_ms`, `passphrase` (rotation), `stream_id`.
          Сменить `address`/`port`/`mode` нельзя — нужен delete+add.
        - **multicast**: `ttl`, `interface`. Сменить `address` — delete+add.
        - **rtmp**: `reconnect`, `max_b_frames`, `drop_after_disconnect_sec`.
          Сменить `url` — delete+add.
        - **hls**: `segment_duration_sec`, `list_size`, `allow_cache`.
          Сменить `dir` — delete+add.
        - **ndi**: `source_name`, `group`, `audio`.

        Попытка hot-patch unsafe поля → 400 с указанием поля. Полный
        список mutable полей — docs/MULTI_OUTPUT.md.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              description: |
                Только subset OutputConfig — поля для patch'а. Тип менять
                нельзя.
      responses:
        '200':
          description: Updated outputs list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputList'
        '400':
          description: Unsafe поле / validation failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/outputs/{output_id}/status:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - $ref: '#/components/parameters/OutputId'
    get:
      tags: [Outputs]
      summary: Detailed per-output status drawer
      description: |
        Подробный snapshot конкретного output'а: state, last_error,
        bytes_sent, packets_sent/dropped, reconnect_count, latency, peer_address,
        type-specific метрики (SRT rtt, packets_lost; HLS active_segment_idx;
        RTMP server-mode connection state; NDI tally).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutputStatus'
        '404':
          description: Channel или output не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Live inputs (read-only status)
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/live-status:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Inputs]
      summary: Status of all live inputs in channel playlist
      description: |
        Read-only snapshot live-input clip'ов из playlist (по entry id).
        UI рендерит LiveInputBadge на каждый.

        Создание/удаление live inputs — через playlist endpoints
        (PUT /api/channels/{id}/playlist).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  channel_id:
                    type: integer
                    format: int64
                  live_inputs:
                    type: array
                    items:
                      $ref: '#/components/schemas/LiveInputStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────────
  # Watcher (ContentSync)
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/watcher/status:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Watcher]
      summary: ContentSync watcher status
      description: |
        Тип watcher'а (`active`/`passthrough`/`disabled`), список dirs,
        last_scan_ts, file_count, scan_errors. Passthrough — канал не
        наблюдает за папкой (admin вручную дёргает `notify-deleted`).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WatcherStatus'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/watcher/rescan:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Watcher]
      summary: Trigger manual rescan
      description: |
        Operator+. Пинает watcher на немедленный re-scan (вне обычного
        polling-интервала). Async — возвращает 202 Accepted.
      responses:
        '202':
          description: Scheduled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  scheduled:
                    type: boolean
                    enum: [true]
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────────────────────────────────
  # WebRTC preview (fix23)
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/preview/offer:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Preview]
      summary: Submit WebRTC SDP offer, get answer + session_id
      description: |
        Создаёт preview-сессию: low-bitrate H.264+Opus over WebRTC.
        Ограничения per-channel (`features.preview.max_clients_per_channel`
        в /api/version) — выше → 429.

        UI должен немедленно начать `RTCPeerConnection` setup, дождаться
        ICE-gathering, отправить offer, получить answer, setRemoteDescription.
        Отдельный `DELETE /preview/sessions/{session_id}` для cleanup.

        Если `features.preview` выключен в build'е → 501.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sdp, type]
              properties:
                sdp:
                  type: string
                type:
                  type: string
                  enum: [offer]
      responses:
        '200':
          description: SDP answer.
          content:
            application/json:
              schema:
                type: object
                required: [session_id, sdp, type]
                properties:
                  session_id:
                    type: string
                    pattern: '^[A-Za-z0-9_-]+$'
                  sdp:
                    type: string
                  type:
                    type: string
                    enum: [answer]
        '400':
          description: Bad SDP offer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          description: Per-channel preview cap exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: Preview compiled out (`features.preview = false`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PreviewManager not wired (no preview backend in current build).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/preview/sessions/{session_id}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: session_id
        in: path
        required: true
        description: Возвращён в ответе на `POST /preview/offer`.
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
    delete:
      tags: [Preview]
      summary: Close preview session
      responses:
        '200':
          description: Closed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [closed]
                  session_id:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: PreviewManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/preview/stats:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Preview]
      summary: Per-channel preview encoder + sessions stats
      description: |
        Encoder kbps, fps, sessions list (session_id, peer_addr, bytes_sent,
        ice_state). Если у канала нет preview pipeline — возвращается
        empty shape (`encoder: null, sessions: []`), без 404.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewStats'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: PreviewManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/preview:
    get:
      tags: [Preview]
      summary: Global preview snapshot (cross-channel)
      description: |
        Cross-channel sessions list для admin/operator overview. Возвращает
        агрегат по всем каналам с активным preview encoder'ом.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_sessions:
                    type: integer
                  channels:
                    type: array
                    items:
                      $ref: '#/components/schemas/PreviewStats'
        '503':
          description: PreviewManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Gateways — packet-level UDP/multicast forwarders, не связанные с каналами.
  # См. docs/GATEWAY.md. При gateways=null core отдаёт 503 (`gateways_not_configured`).
  # ──────────────────────────────────────────────────────────────────────────

  /api/gateways:
    get:
      tags: [Gateways]
      summary: List all configured gateways
      description: |
        Возвращает массив объектов `GatewayStatus` (config + runtime stats).
        Operator+. Viewer'ам endpoint виден на чтение, но без RBAC grant'а
        выдача может быть пустой — gateways не привязаны к каналам, поэтому
        фильтр per-channel-grants на них не действует, отрабатывает только
        role-gate.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GatewayStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Gateways]
      summary: Create new gateway
      description: |
        Admin only. После создания gateway в состоянии `stopped` —
        нужно явно стартовать через `/play` (или передать `autostart: true`
        в config — тогда GatewayManager поднимет на старте core).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayConfig'
      responses:
        '201':
          description: Gateway created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: |
            Семантический конфликт: занятый порт, неправильный mcast addr.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/gateways/{gateway_id}:
    parameters:
      - name: gateway_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
        description: Numeric gateway id.
    get:
      tags: [Gateways]
      summary: Get gateway status
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Gateways]
      summary: Delete gateway
      description: |
        Admin only. Останавливает forwarder и сносит запись из `gateways.json`.
        На активный gateway всё равно ОК — сначала stop, потом delete.
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [deleted]
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Gateways]
      summary: Patch gateway config
      description: |
        Admin only. Hot-reload subset (e.g. ttl, name, autostart). Изменения
        полей, требующих rebind socket'а (input/output addr/port/iface),
        применяются после рестарта (`/play`+`/stop`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GatewayConfig'
      responses:
        '200':
          description: Patched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GatewayStatus'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/gateways/{gateway_id}/play:
    parameters:
      - name: gateway_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Gateways]
      summary: Start gateway forwarder
      description: |
        Operator+. Поднимает recv-socket на input + send-socket на output,
        начинает forwarding. Idempotent: запуск уже запущенного gateway
        возвращает 200.
      responses:
        '200':
          description: Playing.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [playing]
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `bind_failed` — порт занят, или iface unavailable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/gateways/{gateway_id}/stop:
    parameters:
      - name: gateway_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    post:
      tags: [Gateways]
      summary: Stop gateway forwarder
      description: Operator+. Idempotent.
      responses:
        '200':
          description: Stopped.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [stopped]
                  id:
                    type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/gateways/{gateway_id}/fec:
    parameters:
      - name: gateway_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
    get:
      tags: [Gateways]
      summary: Read FEC config + live counters
      description: |
        Operator+. Возвращает блок `FecCfg` со счётчиками `media_rtp_emitted`
        / `column_fec_emitted` / `row_fec_emitted`. Если FEC выключен или
        gateway работает в passthrough mode (FEC pending), вернёт пустой
        объект или объект только с дефолтами.
      responses:
        '200':
          description: FEC block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FecCfg'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Gateways]
      summary: Hot-swap FEC configuration
      description: |
        Operator+. Body — `FecCfg` (read-only counters игнорируются). Под
        капотом эквивалентно `PATCH /api/gateways/{id}` с body
        `{"fec": <body>}`. Hot-swap: gateway останавливается → пересоздаётся
        с новым cfg → запускается (если был running). Валидация:
        L*D ≤ 100, port + max_offset ≤ 65535, column_offset ≠ row_offset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FecCfg'
      responses:
        '200':
          description: Updated FEC block.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FecCfg'
        '400':
          description: Bad config (L*D > 100, port overflow, parse error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: GatewayManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Streams — one-shot PSI probe used by the mux composer UI.
  # ──────────────────────────────────────────────────────────────────────────

  /api/streams/probe:
    post:
      tags: [Streams]
      summary: Sniff a multicast/unicast UDP source and report PSI (PAT/PMT/SDT).
      description: |
        Оператор+. Открывает приёмный UDP-сокет на короткое окно
        (`duration_ms`, зажатый на сервере в 200..10000), собирает PSI-секции
        и возвращает список программ с именами сервисов из SDT, элементарные
        потоки с кодеком и языком, битрейт на PID и суммарный.
        Никакого состояния в GatewayManager не создаёт — только чтение.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamProbeRequest'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreamProbeResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Probe failed (socket open error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # System — host/build introspection, NIC enumeration, GPU encoder probe.
  # ──────────────────────────────────────────────────────────────────────────

  /api/system/interfaces:
    get:
      tags: [System]
      summary: Enumerate host network interfaces
      description: |
        Operator+. Возвращает список IPv4-NIC'ов с флагом `up` и адресами —
        используется UI для дропдаунов в gateway/multicast input/output
        конфиге, чтобы оператор не вписывал имя руками.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NetworkInterface'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/system/gpu:
    get:
      tags: [System]
      summary: Per-backend GPU encoder availability
      description: |
        Operator+. Двухслойный probe: `built_in` (compile-time
        ENABLE_NVENC/QSV/VAAPI) + `codec_registered` (runtime
        `avcodec_find_encoder_by_name`). Расхождение
        `built_in=true, codec_registered=false` = реальная prod
        misconfiguration: бинарь скомпилирован с поддержкой, а слинкованный
        FFmpeg её не содержит.

        UI должен показывать `nvenc/qsv/vaapi` в селекторе encoder'а только
        когда оба флага = true. См. docs/GPU_ENCODER.md.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GpuInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/system/browse:
    get:
      tags: [System]
      summary: List subdirectories (and optionally files) under a filesystem path
      description: |
        Admin-only. Backs the UI folder/file pickers for fields that take a
        directory path (channel `share_path`, HLS `output_dir`) or a file
        path (`fallback.image_path`). The `path` query parameter is
        canonicalised through `std::filesystem::weakly_canonical` before
        listing — relative and `..` components are resolved server-side.
        Hidden entries (starting with `.`) are filtered out.

        By default only directories are returned. Pass `include_files=true`
        to also list regular files (sockets/devices/symlinks-to-non-regular
        are still filtered).
      parameters:
        - in: query
          name: path
          schema: { type: string, default: '/' }
          description: Absolute directory to list. Defaults to `/` if omitted.
        - in: query
          name: include_files
          schema: { type: boolean, default: false }
          description: |
            Include regular files alongside subdirectories. Pass `true` (or `1`)
            for file pickers; omit/`false` for the legacy folder-only view.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [path, parent, entries]
                properties:
                  path:    { type: string }
                  parent:  { type: string, nullable: true, description: 'null at the filesystem root' }
                  entries:
                    type: array
                    items:
                      type: object
                      required: [name, full_path, is_dir]
                      properties:
                        name:       { type: string }
                        full_path:  { type: string }
                        is_dir:     { type: boolean, description: 'true=directory, false=regular file' }
                        size_bytes: { type: integer, format: int64, description: 'Files only.' }
        '404':
          description: 'Path does not exist or is not a directory.'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: not_a_directory }
                  path:  { type: string }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ──────────────────────────────────────────────────────────────────────────
  # System time (fix33) — NTP / system_local / manual clock source, server-wide
  # IANA timezone (с inherit/override на уровне канала). Конфиг хранится в
  # auth.db (TimeConfigRepo). Operator может читать состояние, Admin — менять.
  # ──────────────────────────────────────────────────────────────────────────

  /api/system/time:
    get:
      tags: [System]
      summary: Read effective time configuration + runtime snapshot
      description: |
        Operator+. Возвращает persisted `config` (`source`,
        `server_timezone`, `ntp{...}`, `manual{...}`) и live `runtime`
        snapshot (активный источник, текущее смещение, effective_now vs
        system_now). `runtime.source` отражает фактически активный
        ITimeSource — может временно расходиться с `config.source`, если
        NTP не отвечает и движок fallback'нулся на system_local.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimeConfigResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    put:
      tags: [System]
      summary: Patch time configuration (RFC 7396 merge-patch)
      description: |
        Admin-only. Merge-patch — отсутствующие поля сохраняют текущие
        значения. Смена `server_timezone` пере-резолвит все каналы,
        наследующие server TZ, без рестарта канала (hot-swap через
        Scheduler::setChannelTz). Смена `source` пересоздаёт активный
        ITimeSource. `manual.epoch_unix_ms` — это удобная форма: backend
        вычисляет `offset_ms = epoch_unix_ms - system_now_ms` и сохраняет
        дельту, которая переживает рестарты.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TimeConfigPatch'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [config]
                properties:
                  config:
                    $ref: '#/components/schemas/TimeConfig'
        '400':
          description: |
            Невалидный patch — например, IANA имя не найдено в системной
            tzdata, отрицательный `poll_interval_s`, или пустой список
            `servers` при `ntp.enabled=true`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: invalid_timezone }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/system/time/test:
    post:
      tags: [System]
      summary: Probe NTP servers (does not mutate state)
      description: |
        Admin-only. Одноразовый SNTP-зонд против указанных серверов или
        текущих `ntp.servers`, если тело пустое. Возвращает per-server
        `ok/offset_ms/round_trip_ms` или `error`. **Никакие изменения в
        TimeConfigRepo и активный ITimeSource не вносятся.** Используется
        UI для кнопки "Probe servers" — оператор проверяет связность до
        того, как нажмёт Save.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                servers:
                  type: array
                  items: { type: string }
                  description: |
                    Список serverов для probe; пусто = взять текущие
                    `config.ntp.servers`.
                timeout_ms:
                  type: integer
                  minimum: 100
                  maximum: 10000
                  default: 2000
                  description: 'Per-server timeout. Default 2000.'
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/TimeProbeResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # ──────────────────────────────────────────────────────────────────────────
  # Storage mounts (fix41) — CIFS / NFS shares orchestrated through the
  # privileged liveqx-mountd helper. Все эндпоинты — Admin-only.
  # ──────────────────────────────────────────────────────────────────────────

  /api/system/mounts:
    get:
      tags: [System]
      summary: List configured storage mounts
      description: |
        Admin-only. Возвращает каталог mounts из `state/mounts.db`. Plain-text
        пароли никогда не отдаются — только `has_password` флаг и метаданные
        (`cifs_username`, `cifs_domain`, последний `active_state` от
        background-sync с mountd, который тянет `systemctl is-active`
        раз в 30 секунд).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [mounts]
                properties:
                  mounts:
                    type: array
                    items:
                      $ref: '#/components/schemas/MountPublic'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: MountManager not wired (mountd helper not configured).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [System]
      summary: Create a mount and apply it via mountd
      description: |
        Admin-only. Шифрует CIFS-пароль под master_key, INSERT в БД,
        затем `applyMount` через mountd (рендер systemd `.mount` unit'а
        + enable --now). При неуспехе RPC строка остаётся в БД с
        `error_code=rpc`, оператор может повторить через
        `POST /api/system/mounts/{id}/sync` или DELETE.

        Audit event: `mounts.add` / `mounts.add_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MountSpec'
      responses:
        '201':
          description: Mount inserted and applied. Body — MountPublic + helper_status.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MountPublic'
                  - type: object
                    properties:
                      helper_status: { type: string, description: 'systemd active_state from helper, e.g. "active"' }
        '400':
          description: Spec validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '409':
          description: Duplicate `target` (already in catalogue).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: DB or crypto failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '502':
          description: DB write succeeded but helper RPC failed/timed out.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '503':
          description: MountManager not wired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/system/mounts/test:
    post:
      tags: [System]
      summary: Dry-run a mount spec without persisting
      description: |
        Admin-only. Передаёт spec mountd'у с пометкой test (рендерит
        unit во временный путь, пробует `mount -t fs_type` в read-only
        chroot'е). Ничего не пишется в БД и в `/etc/systemd/system/`.

        Audit event: `mounts.test`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MountSpec'
      responses:
        '200':
          description: Dry-run succeeded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountTestResult' }
        '400':
          description: Spec validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Helper rejected the dry-run.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountTestResult' }
        '503':
          description: MountManager not wired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/system/mounts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
        description: Numeric mount row id from `state/mounts.db`.
    get:
      tags: [System]
      summary: Fetch a single mount row
      description: |
        Admin-only. Возвращает MountPublic (без plain-text пароля).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountPublic' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: MountManager not wired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [System]
      summary: Update a mount and re-apply via mountd
      description: |
        Admin-only. Все mutable поля spec'а заменяются. Семантика пароля:
          • `cifs.password=""` (или поле отсутствует) и в БД пароль уже
            есть — оставляем существующий зашифрованный blob;
          • `cifs.password!=""` — re-encrypt и заменяем;
          • `cifs` отсутствует целиком — wipe креды (CIFS guest или CIFS→NFS).

        Audit event: `mounts.update` / `mounts.update_failed`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MountSpec'
      responses:
        '200':
          description: Mount updated and re-applied.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/MountPublic'
                  - type: object
                    properties:
                      helper_status: { type: string }
        '400':
          description: Spec validation failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Duplicate target after rename.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: DB or crypto failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '502':
          description: DB updated but helper RPC failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '503':
          description: MountManager not wired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [System]
      summary: Remove mount + disable systemd unit
      description: |
        Admin-only. Шлёт `removeMount` mountd'у (disable --now + удаление
        unit-файла + cred-файла), затем DELETE из БД. Идемпотентно —
        повторный вызов на отсутствующей строке возвращает 200.

        Audit event: `mounts.delete` / `mounts.delete_failed`.
      responses:
        '200':
          description: Removed (idempotent).
          content:
            application/json:
              schema:
                type: object
                required: [status, id]
                properties:
                  status: { type: string, example: ok }
                  id:     { type: integer, format: int64 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: DB error.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '502':
          description: Helper RPC failed (DB row may already be gone).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountError' }
        '503':
          description: MountManager not wired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/system/mounts/{id}/sync:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer, format: int64 }
    post:
      tags: [System]
      summary: Pull live status from mountd and merge into the DB row
      description: |
        Admin-only. Дёргает `status()` RPC у mountd, обновляет
        `last_active_state` / `last_status_at` для всех известных
        строк, возвращает только запрошенную. Полезно после ручной
        правки unit-файла или сетевого hiccup'а — даёт оператору
        отрисовку без ожидания background 30s tick.

        Audit event: `mounts.sync`.
      responses:
        '200':
          description: Refreshed row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MountPublic' }
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: MountManager not wired.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /api/version:
    get:
      tags: [System]
      summary: Build/version info + feature flags + plugin attributions
      description: |
        **Public** (security: []). Используется UI как cheap probe
        (есть ли core + какая версия) и для feature-gating: если
        `features.preview=false`, UI прячет вкладку Preview, etc.

        `attributions` — массив строк лицензионных attributions
        от plugin manager'а. UI показывает их в About-диалоге.
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionInfo'
        '503':
          description: MetricsCollector not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/status:
    get:
      tags: [System]
      summary: JSON status snapshot (process + per-channel)
      description: |
        Plain-JSON эквивалент Prometheus `/api/metrics` — для UI, которому
        не нужен экспонент-формат. Содержит uptime, process metrics
        (rss/vsize/fds/cpu) и массив каналов с health/fps/rolling.

        **Filtering by channel_grants (fix32 B1).**
        Endpoint открыт (без required auth), чтобы probes продолжали
        работать без токена. При запросе с валидным `Authorization:
        Bearer <jwt>`:
        - Admin / Operator — видят все каналы и все gateways.
        - Viewer — `channels[]` отфильтрован по его `channel_grants`;
          `gateways[]` пустой; `summary.channels_*` и `summary.gateways_*`
          пересчитаны от видимого подмножества (никогда не утекает
          реальное количество каналов в системе).
        Анонимные запросы (без Bearer) видят полную картину — это нужно
        локальным probe'ам и legacy-мониторингу.

        В отличие от `/api/metrics`, этот endpoint **может** падать на 503
        если `MetricsCollector` не сконфигурирован (минимальный build).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: MetricsCollector not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # TLS — control-plane HTTPS administration (fix38). Admin only.
  # См. docs/TLS.md.
  # ──────────────────────────────────────────────────────────────────────────

  /api/tls/info:
    get:
      tags: [TLS]
      summary: TLS mode + server/CA cert metadata
      description: |
        Возвращает текущий режим TLS (`auto` / `provided` / `behind_proxy` /
        `disabled`), статус listener'а (`tls_enabled`), пути к cert/key и
        каталогу TLS, конфигурируемые SAN-extras, и метаданные
        server-сертификата + внутреннего CA (если он есть на диске).

        Endpoint безопасен для логирования: не возвращает private key и не
        экспортирует CA-bundle (см. `/api/tls/ca-bundle`).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/tls/ca-bundle:
    get:
      tags: [TLS]
      summary: Download internal CA cert (PEM)
      description: |
        Отдаёт `<tls_dir>/ca.crt` как `application/x-pem-file` с
        `Content-Disposition: attachment; filename="liveqx-ca.pem"`.
        Используется UI для кнопки «Скачать CA» — оператор устанавливает
        полученный PEM в системное trust-store / браузер.

        Каждое успешное скачивание пишет audit-событие `tls.ca_export`
        (включает байтовый размер) через `AuthService::emitAudit`.

        Если режим `provided` или `behind_proxy` и `<tls_dir>/ca.crt` не
        существует — 404 `ca_not_found`.

        503 `tls_unavailable` если `tls_dir` не сконфигурирован
        (`disabled` или сборка без TLS).
      responses:
        '200':
          description: PEM CA bundle
          headers:
            Content-Disposition:
              schema: { type: string }
              description: 'attachment; filename="liveqx-ca.pem"'
          content:
            application/x-pem-file:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: CA bundle отсутствует.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string, example: ca_not_found }
                  path:  { type: string }
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: TLS не сконфигурирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tls/regenerate-server:
    post:
      tags: [TLS]
      summary: Re-issue server.crt under the current CA
      description: |
        Перевыпускает `<tls_dir>/server.{crt,key}` от существующего
        внутреннего CA. SAN-список собирается как
        `config.tls.san_extra` ∪ `body.san_extra` ∪ автоопределение
        (hostname + non-loopback интерфейсы + localhost/127.0.0.1/::1).

        Atomic write через `.tmp` + rename. После успеха автоматически
        вызывается `on_tls_reload` — main.cpp останавливает текущий
        listener, пересоздаёт ControlApi с новым `SSLServer` и снова
        принимает соединения. Поле `restart_required: true` оставлено для
        совместимости с ранними версиями UI и означает «listener будет
        перезапущен немедленно», а не «требуется рестарт процесса».

        Audit-событие `tls.regenerate` (SAN'ы + fingerprint + not_after)
        пишется до hot-reload, чтобы запись попала в журнал даже если
        rebind упадёт.

        Применимо только в режиме `auto`. Для `provided` operator должен
        загружать cert через `/api/tls/import`; для `behind_proxy` /
        `disabled` endpoint вернёт 503.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                san_extra:
                  type: array
                  items: { type: string }
                  description: |
                    Дополнительные SAN-имена/IP, объединяются с config-supplied
                    и auto-detect списком.
      responses:
        '200':
          description: Сертификат перевыпущен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsRegenerateResponse'
        '400':
          description: SAN-список пустой или некорректное тело.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Не удалось выпустить cert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TLS не сконфигурирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/tls/import:
    post:
      tags: [TLS]
      summary: Import operator-supplied cert+key (+ optional CA)
      description: |
        Принимает либо `multipart/form-data` (полевые имена `cert`, `key`,
        `ca`) либо `application/json` с теми же ключами и PEM-строками.
        Поле `ca` опционально — если указано, при импорте дополнительно
        проверяется цепочка cert→ca через `verifyChain`.

        Workflow на стороне ядра:
        1. Stage в `<tls_dir>/import.<timestamp>/{server.crt,server.key,ca.crt}`.
        2. `verifyKeyPair(cert,key)` — public match + validity window.
        3. Опционально `verifyChain(cert,ca)`.
        4. Promote через `writePem` (atomic .tmp+rename, chmod 0600 на key,
           0644 на crt) → `<tls_dir>/server.{crt,key}` и опционально
           `<tls_dir>/ca.crt`.
        5. Очистка stage-каталога, audit `tls.import`, hot-reload listener'а.

        Atomic-семантика: если step 2 или 3 упал — старые файлы остались
        нетронутыми, stage очищен, listener продолжает работать на
        предыдущем cert.

        503 `tls_unavailable` если `tls_dir` не сконфигурирован.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cert, key]
              properties:
                cert: { type: string, format: binary, description: 'Server cert PEM' }
                key:  { type: string, format: binary, description: 'Server private key PEM' }
                ca:   { type: string, format: binary, description: 'Опциональный CA PEM' }
          application/json:
            schema:
              type: object
              required: [cert, key]
              properties:
                cert: { type: string, description: 'Server cert PEM' }
                key:  { type: string, description: 'Server private key PEM' }
                ca:   { type: string, description: 'Опциональный CA PEM' }
      responses:
        '200':
          description: Cert/key (+ опционально CA) импортированы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsImportResponse'
        '400':
          description: |
            Невалидные входные данные. Коды:
            * `missing_cert_or_key` — пустой `cert` или `key`.
            * `cert_write_failed` / `key_write_failed` / `ca_write_failed`.
            * `keypair_invalid` — public-key cert'a не совпадает с private key.
            * `chain_invalid` — cert не верифицируется против CA.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: Внутренний сбой stage / promote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: TLS не сконфигурирован.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Plugins — install/uninstall .so backends (NDI и др.). Admin only.
  # См. docs/PLUGINS.md, docs/NDI.md.
  # ──────────────────────────────────────────────────────────────────────────

  /api/plugins:
    get:
      tags: [Plugins]
      summary: List installed plugins
      description: |
        Admin only. Возвращает `{items: PluginListing[]}` с manifest'ами
        каждого плагина: name/version/sha256/installed_at + флаги
        forced/eula_accepted/pending_unload + `output_drivers`/`input_drivers`
        (имена IO-driver'ов которые плагин зарегистрировал).
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: PluginManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins/{plugin_name}:
    parameters:
      - name: plugin_name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        description: Имя плагина (slug, latin alnum + `_`/`-`).
    get:
      tags: [Plugins]
      summary: Get single plugin record
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginListing'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Plugin not installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PluginManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Plugins]
      summary: Uninstall plugin
      description: |
        Admin only. Помечает плагин как `pending_unload` — реальный dlclose
        случится при следующем рестарте core (нельзя выгрузить .so из-под
        активных каналов, использующих его symbol'ы).

        Audit emit: `plugin.uninstall` (или `plugin.uninstall_failed` на IO).
      responses:
        '200':
          description: Marked for unload.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [pending_unload]
                  name:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Plugin not installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          description: PluginManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins/{plugin_name}/install:
    parameters:
      - name: plugin_name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
      - name: force
        in: query
        required: false
        schema:
          type: boolean
        description: |
          Установить даже если sha256 не в allow-list (требует i_understand=true).
      - name: i_understand
        in: query
        required: false
        schema:
          type: boolean
        description: |
          Acknowledgement что админ понимает риски force-install. Без этого
          параметра `force=true` игнорируется.
    post:
      tags: [Plugins]
      summary: Install plugin (.so binary)
      description: |
        Admin only. Принимает либо multipart/form-data с полем `plugin`
        или `file` (UI), либо raw `application/octet-stream` body (curl).

        Pipeline валидации (см. PLUGINS.md):
          1. SHA-256 запрашиваемого blob сверяется с allow-list (можно обойти
             через `force=true&i_understand=true`).
          2. ABI version: dlopen + read symbol `liveqx_plugin_abi`.
          3. Init: вызов `pluginInit()` — если падает, plugin сносится с диска.

        Audit emit: `plugin.install` или `plugin.install_failed` с label
        ошибки в details.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                plugin:
                  type: string
                  format: binary
                file:
                  type: string
                  format: binary
              description: |
                Одно из полей `plugin` или `file` обязательно. Имена
                взаимозаменяемы (legacy совместимость с UI).
          application/octet-stream:
            schema:
              type: string
              format: binary
              description: Raw .so blob (curl `--data-binary @plugin.so`).
      responses:
        '201':
          description: Installed.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [installed]
                  name:
                    type: string
                  sha256:
                    type: string
        '400':
          description: |
            `missing_file`, `empty_file`, `empty_body`, `invalid_upload`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: '`already_installed` (ту же версию ставить нельзя).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '412':
          description: |
            `not_in_allow_list` (sha256 mismatch) или `bad_hash` — без
            force/i_understand pre-condition не пройдена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: |
            `bad_abi` — несовместимая версия плагина для текущего core.
            `init_failed` — `pluginInit()` вернул ошибку.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: '`io_error` — failed to write .so to plugin dir.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PluginManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/plugins/{plugin_name}/eula/accept:
    parameters:
      - name: plugin_name
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
    post:
      tags: [Plugins]
      summary: Mark plugin EULA accepted
      description: |
        Admin only. Некоторые плагины (например, NDI Advanced SDK) требуют
        ручного acceptance их EULA перед использованием. Этот endpoint —
        идемпотентная отметка `eula_accepted=true` в манифесте.

        Audit emit: `plugin.eula_accept`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]
                  name:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Plugin not installed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PluginManager not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Stress — load-generator с историей отчётов. См. docs/STRESS.md.
  # При StressService=null все endpoints отдают 503 (`stress_disabled`).
  # ──────────────────────────────────────────────────────────────────────────

  /api/stress/config:
    get:
      tags: [Stress]
      summary: Get stress runner config
      description: |
        Admin only. Возвращает текущий config: scenario, channels,
        duration_sec, cron + флаги. Loaded из state.db (`fix17`)
        при старте core.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressConfig'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Stress]
      summary: Replace stress runner config
      description: |
        Admin only. Persist'ится в state.db. Cron-расписание hot-reload'ится
        в CronScheduler, новые runs пойдут по новому расписанию.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StressConfig'
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressConfig'
        '400':
          description: |
            `invalid_config` с `detail` содержащим причину (bad cron syntax,
            negative duration_sec, unknown scenario, etc.).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stress/start:
    post:
      tags: [Stress]
      summary: Start stress run now
      description: |
        Admin only. Async kickoff: возвращает 202 + текущий status. Сам run
        идёт в отдельном потоке; прогресс наблюдается через
        `/api/stress/status` или EventBus (`stress_run_started`/
        `stress_run_finished`).
      responses:
        '202':
          description: Run started.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: |
            `cannot_start` — уже идёт run, или конфиг невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stress/stop:
    post:
      tags: [Stress]
      summary: Abort current stress run
      description: |
        Admin only. Idempotent: если run не идёт, просто возвращает текущий
        status. Аборт **сохраняет** partial report (со статусом `aborted`).
      responses:
        '200':
          description: Stopped (or was already stopped).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stress/status:
    get:
      tags: [Stress]
      summary: Current stress run status
      description: |
        Admin only. `running=true/false`, прогресс (channel_count, elapsed_sec),
        next_scheduled_at от CronScheduler.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stress/reports:
    get:
      tags: [Stress]
      summary: List historical stress reports
      description: |
        Admin only. Возвращает массив (возможно пустой) с summary'ями всех
        сохранённых отчётов в `state/stress/`. Полный отчёт с per-channel
        детализацией доступен через `/api/stress/reports/{id}`.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StressReportSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/stress/reports/{report_id}:
    parameters:
      - name: report_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[A-Za-z0-9_\-]+$'
        description: Report id (timestamp-slug, см. STRESS.md).
    get:
      tags: [Stress]
      summary: Get full stress report
      description: |
        Admin only. Полный JSON отчёт: scenario config, per-channel метрики
        (drops, underruns, fps, latency p50/p95/p99), system snapshots до/после.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StressReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          description: StressService disabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Perf — per-channel внутренний профайлер. Off/Sampling/Instrumentation.
  # См. docs/PROFILER.md.
  # ──────────────────────────────────────────────────────────────────────────

  /api/channels/{id}/perf:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      tags: [Perf]
      summary: Profiler snapshot
      description: |
        Operator+. Возвращает `mode` + counters (sampled_hits, stage_us,
        stage_count) + `active_ms`. `mode=off, running=false` валидно для
        существующего, но stopped канала.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/channels/{id}/perf/start:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
      - name: mode
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ProfileMode'
        description: |
          `sampling` или `instrumentation`. Альтернатива — JSON body
          `{"mode": "..."}`.
      - name: reset
        in: query
        required: false
        schema:
          type: boolean
        description: Обнулить counters перед стартом.
    post:
      tags: [Perf]
      summary: Start profiler
      description: |
        Operator+. Switching mode на лету разрешён (вызвать /start второй
        раз с другим mode). Hot-path overhead описан в docs/PROFILER.md:
        Sampling = 1 atomic store/enter, Instrumentation = 2 clock_gettime
        + atomic_add/leave. Render thread isolation сохраняется.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                mode:
                  $ref: '#/components/schemas/ProfileMode'
                reset:
                  type: boolean
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '400':
          description: |
            Missing/invalid mode (`mode=off` тоже отклоняется — для off
            используй /stop).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Канал stopped — профайлер привязан к render thread'у.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/channels/{id}/perf/stop:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    post:
      tags: [Perf]
      summary: Stop profiler (back to Off)
      description: Operator+. Idempotent.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileSnapshot'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Канал stopped.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Metrics + Events
  # ──────────────────────────────────────────────────────────────────────────

  /api/metrics:
    get:
      tags: [Metrics]
      summary: Prometheus exposition
      description: |
        text/plain в формате Prometheus 0.0.4 (см. METRICS.md). Включает
        per-channel fps/drops/underruns, output bytes, gateway packets,
        process metrics, stress run families, profiler counters.

        **Filtering by channel_grants (fix32 B1).**
        Endpoint остаётся открытым (no required auth) для совместимости
        с Prometheus scraper, которые обычно ходят без токена. Если запрос
        приходит с валидным `Authorization: Bearer <jwt>`:
        - Admin / Operator — все per-channel и gateway families.
        - Viewer — только families каналов из его `channel_grants`;
          gateway families скрыты; `liveqx_channels_total` и
          `liveqx_outputs_total` пересчитаны.
        Анонимный scrape (без Bearer) — полная картина.

        Для UI рекомендуем `/api/status` (готовый JSON), а не парсить
        текст; но Prometheus scraper ходит сюда.
      responses:
        '200':
          description: Prometheus exposition.
          content:
            text/plain:
              schema:
                type: string
                example: |
                  # HELP streaming_channel_fps current actual fps
                  # TYPE streaming_channel_fps gauge
                  streaming_channel_fps{channel="ch1"} 25.0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: |
            MetricsCollector not wired (`metrics_collector_not_configured`).
          content:
            text/plain:
              schema:
                type: string

  /api/events/stream:
    get:
      tags: [Events]
      summary: Server-Sent Events stream
      description: |
        Viewer+. text/event-stream long-lived response с keepalive каждые
        15s (`: keepalive\n\n`). Каждое event = `id:`/`event:`/`data:` блок
        c JSON в `data`.

        ## Re-attach

        UI хранит последний `id` из принятых событий и при reconnect'е шлёт
        `Last-Event-ID: <id>` — сервер replay'нёт ring buffer от этого id.
        Если id выпал из buffer'а — сервер пришлёт `event: error`,
        `data: {"error":"event_bus_overflow"}`, после чего клиент должен
        сделать full refetch состояния.

        ## RBAC

        Каждое событие фильтруется per-recipient через `sseEventVisibleTo`:
        viewer без grant'а на канал N не получит событий, относящихся к
        каналу N. Auth/audit-события видят только admin.

        ## Filter

        `?types=type1,type2` — оставляет только перечисленные. Список типов:
        см. `EventType` enum (clip_change, output_state_change,
        live_input_state_change, schedule_active_change,
        watcher_status_change, stress_run_started, stress_run_finished,
        gateway_state_change, plugin_install, plugin_uninstall, и др.).

        `gateway_state_change` payload: `{id, name, state}` где `state` ∈
        `running | stopped | failed`. Видимость: admin + operator.
      parameters:
        - name: types
          in: query
          required: false
          schema:
            type: string
          description: |
            CSV типов событий (см. описание).
        - $ref: '#/components/parameters/LastEventIdHeader'
      responses:
        '200':
          description: Long-lived SSE stream.
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: no
          content:
            text/event-stream:
              schema:
                type: string
                example: |
                  id: 1
                  event: clip_change
                  data: {"channel_id":1,"clip":"intro.mp4"}

                  : keepalive
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: EventBus not wired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # ──────────────────────────────────────────────────────────────────────────
  # Health probes — public, не требуют auth.
  # ──────────────────────────────────────────────────────────────────────────

  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe (cheap)
      description: |
        Public (security: []). Просто `{status: ok}`. Используется
        load-balancer'ом / k8s livenessProbe для тривиального "процесс жив".
        Не делает self-check — для содержательного check'а возьми /livez.
      security: []
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ok]

  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: |
        Public. 200 после того как все startup gate'ы зелёные:
        каналы загружены с диска (`channels_loading`), state persistence
        восстановлен (`state_persistence_loading`), auth db поднята
        (`auth_loading`). До этого — 503 + `reasons[]`.

        Используется k8s readinessProbe / systemd `READY=1` (см. SYSTEMD.md).
      security: []
      responses:
        '200':
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [ready]
        '503':
          description: Still booting.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [not_ready]
                  reasons:
                    type: array
                    items:
                      type: string
                      enum:
                        - channels_loading
                        - state_persistence_loading
                        - auth_loading

  /livez:
    get:
      tags: [Health]
      summary: Liveness probe with stuck-channel self-check
      description: |
        Public. 200 если каналов нет вообще (engine started, idle), либо
        у всех running каналов last_tick_ns свежее `stuck_threshold_seconds`
        (см. config). 500 если хотя бы один канал застрял — Watchdog
        kick'ает с 1Hz cadence, этот probe можно дёргать чаще.
      security: []
      responses:
        '200':
          description: Alive.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [alive]
        '500':
          description: One or more channels stuck.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum: [unhealthy]
                  stuck_channels:
                    type: array
                    items:
                      type: integer

  /api/health:
    get:
      tags: [Health]
      summary: Aggregated health JSON (legacy)
      description: |
        Operator+. Подробный health snapshot: per-channel + overall. 503
        если overall=`failed`. `/livez` и `/readyz` — современная замена;
        `/api/health` оставлен для backward-совместимости с старыми
        мониторингами.
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: One or more channels failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

# ─────────────────────────────────────────────────────────────────────────────
# Components — общие схемы, security scheme, общие параметры/ответы.
# ─────────────────────────────────────────────────────────────────────────────

components:

  # ──────────────────────────────────────────────────────────────────────────
  # Security
  # ──────────────────────────────────────────────────────────────────────────

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Короткоживущий JWT (TTL по конфигу `auth.jwt.access_ttl_sec`,
        дефолт 900s). Получается через `POST /api/auth/login` или
        `POST /api/auth/refresh`. Должен передаваться в заголовке
        `Authorization: Bearer <jwt>`.

  # ──────────────────────────────────────────────────────────────────────────
  # Common error envelope.
  # ──────────────────────────────────────────────────────────────────────────

  schemas:

    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: string
          description: |
            Стабильный snake_case-код. Канонический список (extensible —
            клиент должен fall-back'ом обрабатывать неизвестные значения):
          examples:
            - invalid_json
            - invalid_id
            - unauthorized
            - forbidden
            - password_change_required
            - account_locked
            - not_found
            - already_exists
            - validation_failed
            - requires_restart
            - cannot_start
            - in_use
            - ldap_unavailable
            - feature_disabled
            - service_unavailable
        detail:
          type: string
          description: |
            Опциональный человеко-читаемый текст. UI должен показывать его в toast'е,
            если он есть. Не локализован (английский, иногда с inline JSON).

    # Многие endpoints возвращают список как { items: [...] }.
    # Generic-обёртка подменяется конкретным items-типом через allOf в paths.
    ItemList:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: {}

    # ────────────────────────────────────────────────────────────────────────
    # Auth/User domain
    # ────────────────────────────────────────────────────────────────────────

    Role:
      type: string
      enum: [viewer, operator, admin]
      description: |
        RBAC role. Иерархия: `viewer < operator < admin`. Per-channel grant'ы
        могут добавить право на конкретный канал, но не могут понизить роль.

    Source:
      type: string
      enum: [local, ldap]
      description: |
        Источник учётной записи. `local` — пароль хранится локально в
        SQLite (Argon2id hash). `ldap` — пароль проверяется через bind в
        LDAP-директории; user-row создаётся при первом успешном логине.

    ChannelPermission:
      type: string
      enum: [view, operate]
      description: |
        Канало-привязанное право. `view` — read-only на канал и его
        sub-resources (включая SSE и preview). `operate` — read+write
        (start/stop/playlist/outputs/schedule). Полное удаление канала
        требует роли admin вне зависимости от grant'а.

    ChannelGrant:
      type: object
      required: [channel_id, permission]
      additionalProperties: false
      properties:
        channel_id:
          type: integer
          format: int64
          minimum: 1
        permission:
          $ref: '#/components/schemas/ChannelPermission'

    # fix32 B2 — own-sessions API. Один ряд таблицы Profile/Sessions.
    OwnSession:
      type: object
      required: [jwt_id, created_at, expires_at, ip, user_agent, current, last_seen_at]
      additionalProperties: false
      description: |
        Активная (не revoked, expires_at > now) сессия текущего юзера.
        Источник: AuthDb::listActiveSessionsForUser(user_id, now).
      properties:
        jwt_id:
          type: string
          description: |
            URL-safe base64 без padding (libsodium randombytes). Используется
            UI как primary key + параметр для DELETE /api/auth/me/sessions/{jwt_id}.
        created_at:
          type: integer
          format: int64
          description: 'unix-sec момент логина.'
        expires_at:
          type: integer
          format: int64
          description: 'unix-sec истечения refresh_token (по нему живёт session row).'
        last_seen_at:
          type: integer
          format: int64
          nullable: true
          description: |
            unix-sec последнего успешного verifyActiveAccess. Обновляется с
            throttle 60s. NULL для сессий, по которым ещё ни одного запроса
            не приходило (только что залогинились) или созданных до миграции
            schema v5.
        ip:
          type: string
          description: 'IP-адрес из логина. Может быть пустой строкой.'
        user_agent:
          type: string
          description: 'User-Agent из логина. Может быть пустой строкой.'
        current:
          type: boolean
          description: |
            true если эта строка соответствует access_token, через который
            пришёл запрос (jwt_id == claims.jti). UI ставит на ней «This
            device» badge и блокирует revoke (ревокать → logout).

    # fix32 B3 — master-key metadata для Settings/MasterKey page.
    MasterKeyInfo:
      type: object
      required: [fingerprint, algorithm, source, created_at, last_rotated_at]
      additionalProperties: false
      description: |
        Безопасная к показу metadata XSalsa20-Poly1305 master-ключа.
        Сам ключ не выходит за пределы процесса; здесь только короткий
        fingerprint и timestamps. Источник — `MasterKey::getInfo()`.
      properties:
        fingerprint:
          type: string
          description: |
            Первые 8 байт sha256(key) в hex (16 lowercase chars). Стабилен
            пока ключ не ротировали. UI выводит его как «Key fingerprint».
        algorithm:
          type: string
          enum: [xsalsa20poly1305]
          description: 'Алгоритм шифрования secrets (libsodium crypto_secretbox).'
        source:
          type: string
          enum: [file, env]
          description: |
            Откуда поднят ключ при load(): `env` — из LIVEQX_MASTER_KEY,
            `file` — из state/master.key.
        created_at:
          type: integer
          format: int64
          nullable: true
          description: |
            unix-sec mtime файла master.key. NULL для `source=env` (файла нет).
        last_rotated_at:
          type: integer
          format: int64
          nullable: true
          description: |
            unix-sec mtime самого свежего `master.key.<unix-sec>.bak`
            в state-dir. NULL если backups не существует (ключ ни разу
            не ротировался).

    # User-summary (что возвращается в list). Полная User-структура для
    # detail-view добавит channel_grants[], last_login_at, ldap-fields.
    User:
      type: object
      additionalProperties: false
      description: |
        Источник правды: `userJson()` в src/api/ControlApi.cpp:1654.
        Backend ВСЕГДА эмитит: id, username, email, role, source,
        must_change_password, disabled, created_at, failed_login_count
        (9 полей). Остальные — условные (`if (u.last_login_at) ...`).
        `email` всегда строка (может быть пустой), не null.
      required:
        - id
        - username
        - email
        - role
        - source
        - must_change_password
        - disabled
        - created_at
        - failed_login_count
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[a-zA-Z0-9._-]+$'
        email:
          type: string
          format: email
          description: 'Может быть пустой строкой если у пользователя не задан email.'
        role:
          $ref: '#/components/schemas/Role'
        source:
          $ref: '#/components/schemas/Source'
        disabled:
          type: boolean
        must_change_password:
          type: boolean
          description: |
            true — пользователь должен сменить пароль при следующем логине.
            UI блокирует все действия модальным окном до смены.
        initial_password_expires_at:
          type: integer
          format: int64
          nullable: true
          description: |
            Unix timestamp. Истечение временного пароля (initial password).
            После этой даты логин с временным паролем возвращает 401 even
            если пароль формально верен.
        password_changed_at:
          type: integer
          format: int64
          nullable: true
        last_login_at:
          type: integer
          format: int64
          nullable: true
        last_login_ip:
          type: string
          nullable: true
        failed_login_count:
          type: integer
          minimum: 0
        locked_until:
          type: integer
          format: int64
          nullable: true
          description: |
            Unix timestamp. Если установлен и > now — учётка под brute-force
            lockout, логин возвращает 423. Сбрасывается на admin unlock'е и на
            первом успешном логине после истечения окна.
        created_at:
          type: integer
          format: int64
        created_by:
          type: integer
          format: int64
          nullable: true

    UserDetail:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          properties:
            channel_grants:
              type: array
              items:
                $ref: '#/components/schemas/ChannelGrant'

    # ────────────────────────────────────────────────────────────────────────
    # Audit
    # ────────────────────────────────────────────────────────────────────────

    AuditEvent:
      type: object
      additionalProperties: false
      description: |
        Источник правды: GET /api/auth/audit handler в
        src/api/ControlApi.cpp:2009-2030. Backend ВСЕГДА эмитит id, ts, event;
        остальные — условные (emit только если значение задано/не пустое).
        `details` (parsed object) и `details_raw` (string) — взаимоисключающие:
        backend парсит `e.details_json` и при успехе кладёт в `details`,
        при ошибке парсинга — raw string в `details_raw`.
      required: [id, ts, event]
      properties:
        id:
          type: integer
          format: int64
        ts:
          type: integer
          format: int64
          description: Unix timestamp (seconds).
        event:
          type: string
          description: |
            Snake-case код события. Не enum: каноническое множество живёт
            в `AuthService::audit*` callsites. Известные: `login.ok`,
            `login.fail`, `login.locked`, `logout`, `user.create`, `user.update`,
            `user.delete`, `user.reset_password`, `user.unlock`,
            `password.change`, `role.change`, `grant.add`, `grant.remove`,
            `ldap.bind`, `smtp.test`, `plugin.install`, `plugin.uninstall`,
            `master_key.rotate`. UI рендерит unknown коды как-есть.
          example: login.ok
        user_id:
          type: integer
          format: int64
          description: 'Опционален: emit только если actor известен.'
        username:
          type: string
          description: 'Опционален: emit только если username не пуст.'
        ip:
          type: string
          description: 'Опционален: emit только если ip не пуст.'
        details:
          description: |
            Произвольный JSON-объект (parse `e.details_json`). Опционален.
            Взаимоисключающ с `details_raw`.
          oneOf:
            - type: object
              additionalProperties: true
            - type: array
              items: {}
            - type: string
            - type: number
            - type: boolean
            - type: 'null'
        details_raw:
          type: string
          description: |
            Raw `details_json`-строка, если backend не смог распарсить как
            JSON. Опционален. Взаимоисключающ с `details`.

    # ────────────────────────────────────────────────────────────────────────
    # Health/state
    # ────────────────────────────────────────────────────────────────────────

    HealthState:
      type: string
      enum: [ok, degraded, fail]
      description: |
        Канало-агностический статус. `degraded` — функционирует, но в неполном
        режиме (например, partial outputs). `fail` — не функционирует.

    ChannelState:
      type: string
      enum: [stopped, starting, running, pausing, paused, stopping, error]

    OutputState:
      type: string
      enum: [idle, connecting, running, degraded, reconnecting, fatal]

    LiveInputState:
      type: string
      description: |
        Возвращается `toString(LiveClip::State)` (см. src/clips/LiveClip.cpp:10).
        Значения совпадают с PascalCase-именами enum'а.
      enum: [Idle, WarmingUp, Live, Lost, Finished]

    # ────────────────────────────────────────────────────────────────────────
    # Re-used примитивы.
    # ────────────────────────────────────────────────────────────────────────

    UnixTimestamp:
      type: integer
      format: int64
      description: Unix timestamp в секундах.

    UnixTimestampMs:
      type: integer
      format: int64
      description: Unix timestamp в миллисекундах.

    # ────────────────────────────────────────────────────────────────────────
    # Auth tokens
    # ────────────────────────────────────────────────────────────────────────

    TokenPair:
      type: object
      additionalProperties: false
      description: |
        Источник правды: `tokenPairJson()` в src/api/ControlApi.cpp:1541.
        Backend эмитит UNIX-timestamps `*_expires_at` (НЕ TTL `*_expires_in`),
        плюс `token_type` всегда "Bearer".
      required:
        - access_token
        - refresh_token
        - token_type
        - access_expires_at
        - refresh_expires_at
      properties:
        access_token:
          type: string
          description: |
            JWT. TTL = `auth.jwt.access_ttl_sec` (default 900s). Хранить в
            памяти JS (НЕ в localStorage — XSS).
        refresh_token:
          type: string
          description: |
            Opaque строка (HMAC-подписанная). TTL значительно больше
            (`auth.jwt.refresh_ttl_sec`, default 30 дней). Хранить в
            localStorage — refresh-flow срабатывает редко, риск XSS на
            refresh ниже чем долгоживущий JWT.
        token_type:
          type: string
          enum: [Bearer]
        access_expires_at:
          type: integer
          format: int64
          description: 'Unix timestamp (sec) истечения access_token.'
        refresh_expires_at:
          type: integer
          format: int64
          description: 'Unix timestamp (sec) истечения refresh_token.'

    LoginResponse:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          additionalProperties: false
          description: |
            POST /api/auth/login. Эмитит TokenPair + опциональный `user`-блок
            (присутствует если `lr.user` найден; см. ControlApi.cpp:1603-1610).
          properties:
            user:
              type: object
              additionalProperties: false
              required: [id, username, role, must_change_password]
              properties:
                id:
                  type: integer
                  format: int64
                username:
                  type: string
                role:
                  $ref: '#/components/schemas/Role'
                must_change_password:
                  type: boolean
                  description: |
                    Если true — UI блокирует все действия модальным окном
                    force-change-password до смены.

    # ────────────────────────────────────────────────────────────────────────
    # Channel ACL row (admin view)
    # ────────────────────────────────────────────────────────────────────────

    ChannelPermissionRow:
      type: object
      required: [user_id, username, channel_id, permission, granted_at]
      properties:
        user_id:
          type: integer
          format: int64
        username:
          type: string
        channel_id:
          type: integer
          format: int64
        permission:
          $ref: '#/components/schemas/ChannelPermission'
        granted_at:
          type: integer
          format: int64
        granted_by:
          type: integer
          format: int64
          description: |
            user_id админа, выдавшего grant. 0 — system (до RBAC wiring).

    # ────────────────────────────────────────────────────────────────────────
    # LDAP config
    # ────────────────────────────────────────────────────────────────────────

    LdapTlsMode:
      type: string
      enum: [none, starttls, ldaps]

    LdapChannelAcl:
      type: object
      required: [channel_id, groups]
      properties:
        channel_id:
          type: integer
          format: int64
        groups:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ChannelPermission'
          description: |
            Map: LDAP group DN → ChannelPermission. Юзеру выдаётся самое
            широкое право среди групп, в которых он состоит.

    LdapConfig:
      description: |
        Источник правды: `ldapConfigToJson()` в src/api/ControlApi.cpp:2063.
        GET /api/auth/ldap/config возвращает один из двух вариантов:
        - `{configured: false}` если row в БД нет (handler ControlApi.cpp:2103)
        - полный конфиг + `configured: true` (handler ControlApi.cpp:2107)
      oneOf:
        - $ref: '#/components/schemas/LdapConfigUnconfigured'
        - $ref: '#/components/schemas/LdapConfigConfigured'

    LdapConfigUnconfigured:
      type: object
      additionalProperties: false
      required: [configured]
      properties:
        configured:
          type: boolean
          enum: [false]

    LdapConfigConfigured:
      type: object
      additionalProperties: false
      description: |
        Полный snapshot LDAP-конфига. Backend эмитит ВСЕ 15 полей
        детерминированно (см. `ldapConfigToJson()`).
      required:
        - configured
        - enabled
        - server
        - tls_mode
        - base_dn
        - bind_dn
        - bind_password
        - bind_password_set
        - user_filter
        - group_attribute
        - email_attribute
        - network_timeout_sec
        - recheck_groups_on_refresh
        - group_role_map
        - channel_acl
      properties:
        configured:
          type: boolean
          enum: [true]
        enabled:
          type: boolean
        server:
          type: string
          description: 'host:port или ldap://… / ldaps://…'
        tls_mode:
          $ref: '#/components/schemas/LdapTlsMode'
        base_dn:
          type: string
        bind_dn:
          type: string
        bind_password:
          type: string
          description: |
            Всегда маскированное `"***"` если задан, `""` если нет.
            Реальный пароль наружу не уезжает.
        bind_password_set:
          type: boolean
        user_filter:
          type: string
          description: |
            LDAP-фильтр с `%s` плейсхолдером для username (e.g.
            `(&(objectClass=user)(sAMAccountName=%s))`).
        group_attribute:
          type: string
          description: 'Атрибут группы (default `memberOf`).'
        email_attribute:
          type: string
          description: 'Атрибут email (default `mail`).'
        network_timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
        recheck_groups_on_refresh:
          type: boolean
          description: |
            Если true — на каждом /api/auth/refresh пересчитывается
            mapped_role + channel_grants по directory.
        group_role_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Role'
          description: |
            Map: LDAP group DN → Role. Юзеру выдаётся максимальная
            роль среди матчей.
        channel_acl:
          type: array
          items:
            $ref: '#/components/schemas/LdapChannelAcl'

    LdapConfigRequest:
      type: object
      description: |
        PUT-body. Все поля опциональны (patch). Особо:
        - `bind_password: ""` → игнорируется.
        - `bind_password_unset: true` → явный clear.
      properties:
        enabled:
          type: boolean
        server:
          type: string
        tls_mode:
          $ref: '#/components/schemas/LdapTlsMode'
        base_dn:
          type: string
        bind_dn:
          type: string
        bind_password:
          type: string
          format: password
        bind_password_unset:
          type: boolean
        user_filter:
          type: string
        group_attribute:
          type: string
        email_attribute:
          type: string
        network_timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
        recheck_groups_on_refresh:
          type: boolean
        group_role_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Role'
        channel_acl:
          type: array
          items:
            $ref: '#/components/schemas/LdapChannelAcl'

    LdapTestRequest:
      type: object
      description: |
        Все поля опциональны. Если `username`+`password` не пустые —
        полный bind probe; иначе только ping.
      properties:
        use_saved:
          type: boolean
          default: true
        # override-поля идентичны LdapConfigRequest минус bind_password_unset
        # и recheck_groups_on_refresh (test не сохраняет).
        enabled:
          type: boolean
        server:
          type: string
        tls_mode:
          $ref: '#/components/schemas/LdapTlsMode'
        base_dn:
          type: string
        bind_dn:
          type: string
        bind_password:
          type: string
          format: password
        user_filter:
          type: string
        group_attribute:
          type: string
        email_attribute:
          type: string
        network_timeout_sec:
          type: integer
          minimum: 1
          maximum: 60
        group_role_map:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Role'
        channel_acl:
          type: array
          items:
            $ref: '#/components/schemas/LdapChannelAcl'
        username:
          type: string
        password:
          type: string
          format: password

    LdapTestResponse:
      type: object
      required: [ping]
      properties:
        ping:
          type: object
          required: [ok, latency_ms]
          properties:
            ok:
              type: boolean
            latency_ms:
              type: integer
            error:
              type: string
              description: Только если ok=false.
        bind:
          type: object
          description: |
            Присутствует только если в request'е были username+password.
          required: [ok, reason]
          properties:
            ok:
              type: boolean
            reason:
              type: string
              enum:
                - ok
                - connection_failed
                - service_bind_failed
                - user_not_found
                - invalid_credentials
                - config_error
                - other
            error:
              type: string
            email:
              type: string
            groups:
              type: array
              items:
                type: string
            mapped_role:
              oneOf:
                - $ref: '#/components/schemas/Role'
                - type: 'null'
            grants:
              type: array
              items:
                $ref: '#/components/schemas/ChannelGrant'

    # ────────────────────────────────────────────────────────────────────────
    # SMTP config
    # ────────────────────────────────────────────────────────────────────────

    SmtpSecurity:
      type: string
      enum: [none, starttls, tls]

    SmtpConfig:
      type: object
      additionalProperties: false
      description: |
        GET /api/auth/smtp/config response. Источник правды:
        `smtpConfigToJson()` в src/api/ControlApi.cpp:2649. Backend ВСЕГДА
        эмитит все 9 полей (если row в БД нет — те же 9 со значениями
        по умолчанию SmtpConfig{}). Асимметрия с LdapConfig: НЕТ
        `configured`-флага. password write-only — наружу только
        `password_set`.
      required:
        - enabled
        - server
        - port
        - security
        - username
        - password_set
        - from_email
        - from_name
        - timeout_sec
      properties:
        enabled:
          type: boolean
        server:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          $ref: '#/components/schemas/SmtpSecurity'
        username:
          type: string
        password_set:
          type: boolean
          description: 'true если пароль задан в БД (само значение наружу не отдаётся).'
        from_email:
          type: string
        from_name:
          type: string
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 300

    SmtpConfigRequest:
      type: object
      description: |
        PUT-body. Patch. Password:
        - отсутствует → сохраняется текущий.
        - `""` → явный delete.
        - non-empty → новое значение.
      properties:
        enabled:
          type: boolean
        server:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          $ref: '#/components/schemas/SmtpSecurity'
        username:
          type: string
        password:
          type: string
          format: password
        from_email:
          type: string
        from_name:
          type: string
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 300

    SmtpTestRequest:
      type: object
      required: [to]
      properties:
        to:
          type: string
          format: email
        subject:
          type: string
          default: 'LiveQX SMTP test'
        body:
          type: string
        use_saved:
          type: boolean
          default: true
        # override-fields:
        server:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        security:
          $ref: '#/components/schemas/SmtpSecurity'
        username:
          type: string
        password:
          type: string
          format: password
        from_email:
          type: string
        from_name:
          type: string
        timeout_sec:
          type: integer
          minimum: 1
          maximum: 300

    SmtpTestResponse:
      type: object
      required: [ok, latency_ms]
      properties:
        ok:
          type: boolean
        latency_ms:
          type: integer
        error:
          type: string
          description: 'Только если ok=false.'

    # ────────────────────────────────────────────────────────────────────────
    # Channel — структура config полностью описана в docs/CHANNEL_LAYOUT.md.
    # Мы документируем только ключевые поля; остальные принимаются как
    # additionalProperties (passthrough в server-side parser). Это
    # сознательно — full schema каналов слишком обширна и быстро устареет
    # относительно openapi.yaml. UI читает status через ChannelStatus
    # (структура snapshot'а) и не обращается напрямую к config-полям.
    # ────────────────────────────────────────────────────────────────────────

    ChannelConfigRequest:
      type: object
      additionalProperties: true
      description: |
        POST /api/channels body. Required minimum: `name`. Полный набор
        полей — см. docs/CHANNEL_LAYOUT.md и docs/TECHNICAL_SPEC.md.
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            Immutable. После создания папка `channels/ch{id}-{sanitized_name}/`
            привязывается к этому имени; переименование = пересоздание канала.
        default_photo_duration:
          type: number
          format: float
          minimum: 0.1
          description: 'Сек. Применяется к photo-entries без явного duration.'
        fallback:
          type: object
          description: |
            Заглушка канала. Передаётся при создании; для смены после
            этого требуется restart канала (FallbackClip строится один раз).
          properties:
            image_path:
              type: string
              description: 'Абсолютный путь к фото-заглушке. Пусто = чёрный кадр.'
        numa_node:
          type: integer
          minimum: -1
          description: '-1 = no pinning. Иначе NUMA-нода для render thread + FramePool.'
        encoder_mode:
          type: string
          enum: [auto, x264, nvenc, qsv, vaapi]
          description: 'Compile-time gated (NVENC/QSV/VAAPI могут быть disabled).'
        gpu_index:
          type: integer
          minimum: 0
          description: 'Только если encoder_mode != x264.'
        playlist:
          $ref: '#/components/schemas/Playlist'
        schedule:
          $ref: '#/components/schemas/Schedule'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OutputConfig'

    ChannelConfigPatch:
      type: object
      additionalProperties: true
      description: |
        PUT /api/channels/{id}/config body. **`name` запрещён** (immutable
        — попытка указать → 400). Hot-reloadable subset применяется мгновенно;
        другие поля → 409 requires_restart.

    ChannelStatus:
      type: object
      additionalProperties: true
      description: |
        Snapshot состояния канала, возвращаемый ChannelInstance::status().
        Поля помечены как required только если backend эмитит их безусловно.
      required:
        - id
        - name
        - state
        - resolution
        - fps_target
        - numa_node
        - bitrate
        - preset
        - max_b_frames
        - outputs
        - content_source
        - current_clip_index
        - current_clip_remaining_sec
        - srt_connected
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state:
          type: string
          description: |
            Производное состояние канала. `stopped` когда running flag
            не выставлен; иначе health-state канала (`running|degraded|failed`).
          enum: [stopped, running, degraded, failed]
        resolution:
          type: string
          description: 'Encoded "{width}x{height}", e.g. "1280x720".'
        fps_target:
          type: integer
          description: 'Target FPS из конфигурации канала.'
        fps_actual:
          type: number
          description: |
            Фактический FPS из metrics_->snapshot(); эмитится только
            когда у канала есть metrics-pipeline.
        numa_node:
          type: integer
          description: 'NUMA-нода, к которой пинуется render+encoder pipeline.'
        bitrate:
          type: integer
          format: int64
        preset:
          type: string
        max_b_frames:
          type: integer
        encoder_mode:
          type: string
          enum: [auto, cpu, x264, nvenc, qsv, vaapi]
          description: |
            Активный режим энкодера. Зеркало `enc_cfg_.encoder_mode` —
            эмитится status()-ом всегда (default `cpu`), даже если в cfg
            не задано. UI использует для подсветки требующих рестарта
            полей в Channel → Конфигурация.
        gpu_index:
          type: integer
          minimum: 0
          description: |
            Индекс GPU для аппаратных энкодеров (nvenc/qsv/vaapi). Эмитится
            всегда, даже когда encoder_mode=cpu/x264 (тогда поле игнорируется).
        preload_sec:
          type: number
          format: float
          minimum: 0.5
          description: |
            Сек. Окно префетча декодера (lookahead). Фиксируется на старте
            канала — patch применяется при следующем play().
        channel_timezone:
          type: string
          nullable: true
          description: |
            IANA таймзона канала (e.g. "Europe/Moscow"). `null` означает
            наследование server-wide TZ из `/api/system/time`; в этом
            случае effective_timezone отражает фактически применяемую зону.
        inherits_server_tz:
          type: boolean
          description: |
            Канал наследует server-wide timezone (channel_timezone is null).
            Меняется автоматически при изменении channel_timezone.
        effective_timezone:
          type: string
          description: |
            Фактически применяемая IANA-зона: channel_timezone если задана,
            иначе server_timezone из /api/system/time. Read-only.
        frame_pool_bytes:
          type: integer
          format: int64
          minimum: 0
          description: |
            Суммарный размер кадровых пулов канала (decode_pool + render_pool),
            предварительно выделенных при buildLongLived. Помогает оценить
            фактический RAM-footprint на канал. `0`, если каналы ещё не
            построены (channel создан, но play не вызывался).
        default_photo_duration:
          type: number
          format: float
          minimum: 0.1
          description: |
            Сек. Default duration для image-entries без явного duration
            (отзеркаливается из cfg_; hot-reloadable через PUT config).
        default_transition:
          type: object
          additionalProperties: false
          required: [type, duration, easing]
          description: |
            Текущий default-переход канала (отзеркаливается из cfg_ через
            parse_default_transition). Hot-reloadable через PUT config.
            Эмитится всегда — UI читает его, чтобы инициализировать форму
            конфига; ранее поле отсутствовало и форма всегда показывала
            пустые выпадашки независимо от реального состояния.
          properties:
            type:
              type: string
              enum:
                [crossfade, wipe_left, wipe_right, wipe_up, wipe_down,
                 push_left, push_right, push_up, push_down,
                 dissolve, fade_black, hardcut]
            duration:
              type: number
              description: 'Сек.'
            easing:
              type: string
              enum: [linear, ease_in, ease_out, ease_in_out]
        fallback:
          type: object
          description: |
            Конфигурация заглушки канала. FallbackClip строится один раз
            при buildLongLived; смена `image_path` требует **рестарта
            канала** — patch принимается, но не пересобирает клип.
          properties:
            image_path:
              type: string
              description: 'Абсолютный путь к фото-заглушке. Пусто = чёрный кадр.'
        outputs:
          type: array
          description: |
            Per-driver status. Когда канал running — каждый элемент
            берётся из соответствующего IOutput::statusJson(); когда канал
            stopped — отдаётся последний known-good cfg. UI должен быть
            толерантен к обоим вариантам.
          items:
            $ref: '#/components/schemas/OutputStatus'
        output:
          allOf:
            - $ref: '#/components/schemas/OutputStatus'
          description: |
            DEPRECATED. Зеркало `outputs[0]` для legacy single-output клиентов.
            Эмитится ровно когда `outputs.length == 1`. Multi-output каналы
            этого поля не возвращают — используйте `outputs`.
        content_source:
          type: object
          nullable: true
          description: |
            Источник медиа канала. `null` когда канал не имеет content-source
            конфигурации; иначе один из двух вариантов (passthrough или cache).
          oneOf:
            - type: object
              required: [mode, source_path]
              properties:
                mode:
                  type: string
                  enum: [passthrough]
                source_path:
                  type: string
            - type: object
              required: [mode, share_path, cache_path]
              properties:
                mode:
                  type: string
                  enum: [cache]
                share_path:
                  type: string
                cache_path:
                  type: string
        playback_log:
          type: object
          nullable: true
          description: |
            Конфигурация sink-а журнала воспроизведения. `null` когда блок
            не задан (эквивалент sink="none"). Patch принимается только
            при остановленном канале.
          properties:
            sink:
              type: string
              enum: [none, file, db]
            retention_days:
              type: integer
              minimum: 0
              description: 'TTL записей в БД. 0 = бессрочно.'
        current_clip_index:
          type: integer
          description: |
            Индекс играющего сейчас клипа в playlist'е, либо -1 если
            timeline пуст / канал stopped.
        current_clip_remaining_sec:
          type: number
          description: 'Сек до конца текущего клипа.'
        srt_connected:
          type: boolean
          description: |
            DEPRECATED legacy-поле для one-output SRT каналов. Всегда `false`
            если первичный output не SRT. Используйте `outputs[].healthy`.
        frames_dropped:
          type: integer
          format: int64
          description: 'Эмитится только когда у канала есть metrics-pipeline.'
        frames_rendered:
          type: integer
          format: int64
          description: 'Эмитится только когда у канала есть metrics-pipeline.'

    # ────────────────────────────────────────────────────────────────────────
    # Playlist & entries
    # ────────────────────────────────────────────────────────────────────────

    Playlist:
      type: array
      description: Массив playlist entries.
      items:
        $ref: '#/components/schemas/PlaylistEntry'

    PlaylistEntry:
      oneOf:
        - $ref: '#/components/schemas/PlaylistEntryFile'
        - $ref: '#/components/schemas/PlaylistEntryLive'
      discriminator:
        propertyName: type
        mapping:
          image: '#/components/schemas/PlaylistEntryFile'
          video: '#/components/schemas/PlaylistEntryFile'
          file:  '#/components/schemas/PlaylistEntryFile'
          live:  '#/components/schemas/PlaylistEntryLive'

    PlaylistEntryFile:
      type: object
      additionalProperties: true
      required: [path]
      description: |
        File entry. `type` опциональный (legacy without-type entries
        работают как file). Если type указан — `image|video|file`.
      properties:
        type:
          type: string
          enum: [image, video, file]
          description: |
            Hint для UI. Сервер автодетектит из extension/probe и не
            требует чтобы клиент указывал тип верно.
        path:
          type: string
          description: Absolute path или relative от channel dir.
        duration:
          type: number
          format: float
          minimum: 0.1
          description: |
            Сек. Только для image-entries. Для video — игнорируется
            (берётся из контейнера).
        transition_in:
          $ref: '#/components/schemas/Transition'
        transition_out:
          $ref: '#/components/schemas/Transition'

    PlaylistEntryLive:
      type: object
      required: [type, id, input, live]
      properties:
        type:
          type: string
          enum: [live]
        id:
          type: string
          minLength: 1
          description: |
            Unique-в-playlist id. UI/SSE используют его в `/live-status`
            и в LiveInputBadge мэпинге.
        input:
          $ref: '#/components/schemas/LiveInputConfig'
        live:
          type: object
          properties:
            duration_sec:
              type: number
              format: float
              minimum: 0
              description: 'Сколько играть. 0 = до loss/manual cut.'
            warm_up_sec:
              type: number
              format: float
              minimum: 0
              description: 'Pre-roll: сколько секунд буферизовать до start.'
            loss_threshold_sec:
              type: number
              format: float
              minimum: 0
              description: |
                Сек без packets'ов = считается loss → fallback_on_loss.
        fallback_on_loss:
          type: string
          enum: [fallback_clip, freeze, black]
          description: |
            Реакция на loss. `fallback_clip` — переход на FallbackClip;
            `freeze` — last frame in loop; `black` — чёрный кадр.
        transition_in:
          $ref: '#/components/schemas/Transition'
        transition_out:
          $ref: '#/components/schemas/Transition'

    Transition:
      type: object
      additionalProperties: true
      description: |
        Полная схема — см. docs/TECHNICAL_SPEC.md (CrossFade/Push*/Easing).
      properties:
        type:
          type: string
          enum: [crossfade, push_left, push_right, push_up, push_down]
        duration_sec:
          type: number
          format: float
          minimum: 0
        easing:
          type: string
          enum: [linear, ease_in, ease_out, ease_in_out]

    LiveInputConfig:
      type: object
      additionalProperties: true
      required: [type]
      description: |
        Discriminated union по `type`. Полные схемы каждого типа
        — см. docs/LIVE_INPUT.md, RTMP.md, RTSP.md, MULTICAST.md, NDI.md.
      properties:
        type:
          type: string
          enum: [multicast, rtmp, rtsp, ndi]
        url:
          type: string
          description: 'rtmp://, rtsp://, udp://multicast/group, etc.'
        source_name:
          type: string
          description: 'NDI source name (для type=ndi).'

    # ────────────────────────────────────────────────────────────────────────
    # Schedule
    # ────────────────────────────────────────────────────────────────────────

    Schedule:
      type: array
      items:
        $ref: '#/components/schemas/ScheduleEntry'

    ScheduleEntry:
      type: object
      additionalProperties: false
      description: |
        Один schedule entry. Сериализуется `serializeEntry()`
        (см. src/core/ScheduleEntry.cpp:342). Полная семантика —
        docs/SCHEDULE.md.
      required:
        - id
        - playlist
        - transition
        - recurrence
        - priority
        - loop_mode
        - hard_switch
      properties:
        id:
          type: string
          description: 'Stable per-channel id (UUID или slug).'
        playlist:
          type: array
          minItems: 1
          items:
            type: string
          description: |
            Список путей к клипам, которые играют в окне (см.
            src/core/ScheduleEntry.cpp:194–201, ScheduleEntry::playlist
            — std::vector<std::string>). Пути резолвятся
            ClipFactory::buildClip() в момент активации окна.
        transition:
          $ref: '#/components/schemas/ScheduleTransition'
        recurrence:
          $ref: '#/components/schemas/Recurrence'
        priority:
          type: integer
          minimum: 0
          maximum: 1000
          default: 100
          description: |
            Высший приоритет выигрывает при overlapping окон. Playlist
            играет когда нет активного schedule entry'а.
        effective_from:
          type: string
          description: 'YYYY-MM-DD — entry активен с этой даты (Cond).'
        effective_to:
          type: string
          description: 'YYYY-MM-DD — entry активен до этой даты включительно (Cond).'
        loop_mode:
          type: string
          description: 'Берётся из `loopModeName()` — src/core/ScheduleEntry.cpp:99.'
          enum: [loop, play_once_then_idle]
        hard_switch:
          type: boolean
          description: |
            true — сразу прерывает текущий клип на старте entry'а
            (без доигрывания). false — entry стартует на следующей
            clip-boundary.

    ScheduleTransition:
      type: object
      additionalProperties: false
      required: [type, mode, duration, easing]
      properties:
        type:
          type: string
          description: |
            Имя transition type из `transitionTypeName()`
            (src/core/ScheduleEntry.cpp:47).
          enum:
            [crossfade, wipe_left, wipe_right, wipe_up, wipe_down,
             push_left, push_right, push_up, push_down,
             dissolve, fade_black, hardcut]
        mode:
          type: string
          description: 'Из `transitionModeName()` (ScheduleEntry.cpp:84).'
          enum: [hard_cut, freeze_fade, live_mix]
        duration:
          type: number
          description: 'Сек.'
        easing:
          type: string
          enum: [linear, ease_in, ease_out, ease_in_out]

    Recurrence:
      oneOf:
        - $ref: '#/components/schemas/RecurrenceOnce'
        - $ref: '#/components/schemas/RecurrenceDaily'
        - $ref: '#/components/schemas/RecurrenceWeekly'
        - $ref: '#/components/schemas/RecurrenceMonthly'
      discriminator:
        propertyName: kind
        mapping:
          once:    '#/components/schemas/RecurrenceOnce'
          daily:   '#/components/schemas/RecurrenceDaily'
          weekly:  '#/components/schemas/RecurrenceWeekly'
          monthly: '#/components/schemas/RecurrenceMonthly'

    RecurrenceOnce:
      type: object
      additionalProperties: false
      required: [kind, start_at, end_at]
      properties:
        kind:
          type: string
          enum: [once]
        start_at:
          type: string
          description: 'ISO8601 UTC: YYYY-MM-DDTHH:MM:SSZ.'
        end_at:
          type: string

    RecurrenceDaily:
      type: object
      additionalProperties: false
      required: [kind, start_time, end_time]
      properties:
        kind:
          type: string
          enum: [daily]
        start_time:
          type: string
          description: 'HH:MM (24h, UTC).'
          example: '08:00'
        end_time:
          type: string
          example: '23:30'

    RecurrenceWeekly:
      type: object
      additionalProperties: false
      required: [kind, start_time, end_time, days_of_week]
      properties:
        kind:
          type: string
          enum: [weekly]
        start_time:
          type: string
        end_time:
          type: string
        days_of_week:
          type: array
          items:
            type: integer
            minimum: 0
            maximum: 6
          description: '0=Sun..6=Sat.'

    RecurrenceMonthly:
      type: object
      additionalProperties: false
      required: [kind, start_time, end_time, days_of_month]
      properties:
        kind:
          type: string
          enum: [monthly]
        start_time:
          type: string
        end_time:
          type: string
        days_of_month:
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 31

    ScheduleActive:
      type: object
      additionalProperties: false
      description: |
        Возвращает `Scheduler::statusJson()`
        (см. src/core/Scheduler.cpp:224).
      required: [mode, entry_id, window_end_ns]
      properties:
        mode:
          type: string
          enum: [schedule, regular]
        entry_id:
          type: string
          nullable: true
          description: 'null когда mode=regular.'
        window_end_ns:
          type: integer
          format: int64
          nullable: true
          description: 'monotonic-ns конец активного окна; null когда regular.'

    ScheduleUpcomingItem:
      type: object
      additionalProperties: true
      required: [entry_id, starts_at]
      properties:
        entry_id:
          type: string
        starts_at:
          $ref: '#/components/schemas/UnixTimestamp'
        ends_at:
          $ref: '#/components/schemas/UnixTimestamp'
        priority:
          type: integer

    # ────────────────────────────────────────────────────────────────────────
    # Playback log
    # ────────────────────────────────────────────────────────────────────────

    PlaybackLogStatus:
      type: object
      properties:
        sink:
          type: string
          enum: [none, file, sqlite]
        path:
          type: string
        size_bytes:
          type: integer
          format: int64
        count:
          type: integer
          format: int64
        last_event_ts_ns:
          type: integer
          format: int64
          nullable: true

    PlaybackLogResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaybackLogEntry'
        truncated:
          type: boolean
          description: 'true — лимит достигнут, есть ещё записи.'

    PlaybackLogEntry:
      type: object
      additionalProperties: true
      required: [ts_ns, event]
      properties:
        ts_ns:
          type: integer
          format: int64
        event:
          type: string
          enum: [clip_start, clip_end, transition_in, transition_out]
        clip_id:
          type: string
        clip_kind:
          type: string
          enum: [image, video, live, fallback]
        path:
          type: string
        duration_sec:
          type: number

    # ────────────────────────────────────────────────────────────────────────
    # Output config — discriminated union по `type`.
    # Полные shape каждого типа — docs/MULTI_OUTPUT.md, RTMP.md, HLS.md,
    # MULTICAST.md, NDI.md.
    # ────────────────────────────────────────────────────────────────────────

    OutputConfig:
      oneOf:
        - $ref: '#/components/schemas/OutputConfigSrt'
        - $ref: '#/components/schemas/OutputConfigMulticast'
        - $ref: '#/components/schemas/OutputConfigRtmp'
        - $ref: '#/components/schemas/OutputConfigHls'
        - $ref: '#/components/schemas/OutputConfigNdi'
      discriminator:
        propertyName: type
        mapping:
          srt:        '#/components/schemas/OutputConfigSrt'
          multicast:  '#/components/schemas/OutputConfigMulticast'
          rtmp:       '#/components/schemas/OutputConfigRtmp'
          hls:        '#/components/schemas/OutputConfigHls'
          ndi:        '#/components/schemas/OutputConfigNdi'

    OutputConfigBase:
      type: object
      required: [id, type]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Unique-в-channel id. Стабильный — не меняется при patch.'
        type:
          type: string
          enum: [srt, multicast, rtmp, hls, ndi]
        enabled:
          type: boolean
          default: true

    OutputConfigSrt:
      allOf:
        - $ref: '#/components/schemas/OutputConfigBase'
        - type: object
          required: [address, port]
          properties:
            type:
              type: string
              enum: [srt]
            address:
              type: string
              description: 'host или IP. Для listener-mode — bind address.'
            port:
              type: integer
              minimum: 1
              maximum: 65535
            mode:
              type: string
              enum: [caller, listener, rendezvous]
              default: caller
            latency_ms:
              type: integer
              minimum: 20
              maximum: 8000
              default: 200
            passphrase:
              type: string
              description: '10-79 символов. write-only в смысле UI (не возвращается).'
            pbkeylen:
              type: integer
              enum: [16, 24, 32]
              description: 'AES-key length.'
            stream_id:
              type: string
              maxLength: 512
            bind_address:
              type: string
              description: |
                Optional source-NIC bind address (IPv4 string). Empty =
                kernel default-route NIC. Pinned via srt_bind() before
                listen() on multi-NIC hosts where the public-uplink NIC
                isn't the default-route NIC.

    OutputConfigMulticast:
      allOf:
        - $ref: '#/components/schemas/OutputConfigBase'
        - type: object
          required: [address, port]
          properties:
            type:
              type: string
              enum: [multicast]
            address:
              type: string
              description: 'IPv4 multicast 224.0.0.0/4 или IPv6 ff00::/8.'
            port:
              type: integer
              minimum: 1
              maximum: 65535
            bind_address:
              type: string
              description: |
                Optional source-NIC bind address (IPv4 string). Empty =
                kernel routing. Drives IP_MULTICAST_IF. Canonical key —
                use this for new writes; `interface` is the legacy alias
                kept for one release cycle.
            interface:
              type: string
              deprecated: true
              description: |
                Legacy alias for `bind_address` (IPv4 string). Still
                accepted on read; do not use for new writes.
            ttl:
              type: integer
              minimum: 1
              maximum: 255
              default: 1
            payload_type:
              type: string
              enum: [mpegts, raw]
              default: mpegts

    OutputConfigRtmp:
      allOf:
        - $ref: '#/components/schemas/OutputConfigBase'
        - type: object
          required: [url]
          properties:
            type:
              type: string
              enum: [rtmp]
            url:
              type: string
              description: |
                rtmp:// или rtmps://. Поддерживается server-mode listening
                (rtmp://0.0.0.0:1935/app/key) — см. RTMP.md.
            mode:
              type: string
              enum: [client, server]
              default: client
            reconnect:
              type: boolean
              default: true
            max_b_frames:
              type: integer
              minimum: 0
              maximum: 8
              default: 0
              description: |
                YouTube/Twitch RTMP servers ломаются на B-frames в некоторых
                комбинациях; default 0 безопаснее. См. RTMP.md.
            drop_after_disconnect_sec:
              type: integer
              minimum: 0
              description: |
                После Nс отсутствия client'а в server-mode — бросаем frames
                (вместо backpressure'а на render thread).
            bind_address:
              type: string
              description: |
                Optional source-NIC bind address (IPv4 string). Empty =
                kernel default-route NIC. Wired into FFmpeg's `localaddr`
                option so the outgoing TCP socket binds to this NIC
                before connect(). Works for rtmp:// and rtmps://.

    OutputConfigHls:
      allOf:
        - $ref: '#/components/schemas/OutputConfigBase'
        - type: object
          required: [dir]
          properties:
            type:
              type: string
              enum: [hls]
            dir:
              type: string
              description: 'Output directory. Создаётся если нет.'
            segment_duration_sec:
              type: number
              format: float
              minimum: 0.5
              maximum: 30
              default: 4
            list_size:
              type: integer
              minimum: 3
              default: 5
              description: 'Количество сегментов в playlist.m3u8.'
            allow_cache:
              type: boolean
              default: false

    OutputConfigNdi:
      allOf:
        - $ref: '#/components/schemas/OutputConfigBase'
        - type: object
          required: [source_name]
          properties:
            type:
              type: string
              enum: [ndi]
            source_name:
              type: string
              description: 'Имя NDI source. Должно быть уникально в группе.'
            group:
              type: string
              default: ''
              description: 'NDI group. Пусто = "Public" по умолчанию.'
            audio:
              type: boolean
              default: true

    OutputList:
      type: object
      properties:
        channel_id:
          type: integer
          format: int64
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/OutputStatus'

    OutputStatus:
      type: object
      additionalProperties: true
      description: |
        Per-driver runtime status. Shape возвращает соответствующий
        IOutput::statusJson() (SRT/RTMP/Multicast/HLS/NDI) с двумя
        обёртками от OutputManager (`id`, `queue_*`).

        Дискриминатор:
          • SRT/RTMP/Multicast/HLS — поле `transport` ("srt"|"rtmp"|"multicast"|"hls").
          • NDI — поле `mode` ("ndi"); `transport` отсутствует (driver
            подгружается плагином и сохраняет легаси-имя поля).

        Поля помечены required только если backend эмитит их безусловно
        в ОБОИХ ветках (running и stopped) или базовый IOutput::statusJson().
        UI обязан быть толерантен к фактическому per-driver набору.
      required:
        - id
        - queue_drops
        - queue_bytes_used
        - queue_bytes_limit
        - healthy
      properties:
        # ── OutputManager-обёртка (всегда добавляется поверх driver shape) ──
        id:
          type: string
          description: 'Стабильный per-channel id, выданный OutputManager.'
        queue_drops:
          type: integer
          format: int64
          description: 'Сколько пакетов сброшено из-за byte-budget overflow.'
        queue_bytes_used:
          type: integer
          format: int64
        queue_bytes_limit:
          type: integer
          format: int64

        # ── Базовые поля IOutput::statusJson() ──
        # Эмитятся всеми драйверами кроме HLS (HLS строит JSON с нуля,
        # без bitrate_bps/rtt_ms — но имеет свои packets_sent/bytes_sent/healthy).
        bitrate_bps:
          type: number
          description: 'Скользящий битрейт в bps. HLS не эмитит.'
        rtt_ms:
          type: number
          description: 'RTT в ms (только SRT актуально). HLS не эмитит.'
        healthy:
          type: boolean
          description: 'isHealthy() от драйвера.'
        packets_sent:
          type: integer
          format: int64
        bytes_sent:
          type: integer
          format: int64

        # ── Дискриминатор транспорта ──
        transport:
          type: string
          enum: [srt, rtmp, multicast, hls]
          description: 'Эмитят SRT/RTMP/Multicast/HLS драйверы.'
        mode:
          type: string
          enum: [ndi]
          description: 'NDI-only marker (legacy from плагин-loader времён).'

        # ── SRT-only ──
        port:
          type: integer
          description: 'SRT listener port или Multicast port.'
        latency_ms:
          type: integer
          description: 'SRT-only.'
        connected:
          type: boolean
          description: 'SRT/RTMP — есть ли peer.'

        # ── RTMP-only ──
        host:
          type: string
          description: 'RTMP — sanitized (без stream-key).'
        packets_dropped:
          type: integer
          format: int64
          description: 'RTMP/Multicast/HLS — общий счётчик дропов.'
        reconnect_count:
          type: integer
          description: 'RTMP — счётчик реконнектов.'

        # ── SRT / RTMP / Multicast NIC pin ──
        bind_address:
          type: string
          description: |
            Source-NIC bind address (IPv4 string) configured for this output.
            Empty when the output uses the OS default route. Emitted by
            SRT, RTMP and Multicast outputs.

        # ── Multicast-only ──
        address:
          type: string
        interface:
          type: string
          deprecated: true
          description: |
            Legacy alias of `bind_address` for multicast outputs. No
            longer emitted — kept here for one release cycle for older
            clients still narrowing on this field name.
        ttl:
          type: integer
        send_errors:
          type: integer
          format: int64

        # ── HLS-only ──
        output_dir:
          type: string
        playlist_path:
          type: string
        segment_duration_sec:
          type: number
        playlist_size:
          type: integer
        segments_present:
          type: integer
        last_segment:
          type: string
        last_segment_age_ms:
          type: integer
          format: int64
        last_packet_age_ms:
          type: integer
          format: int64
        started:
          type: boolean

        # ── NDI-only ──
        ndi_name:
          type: string
        ndi_groups:
          type: string
        ndi_loaded:
          type: boolean
        ndi_version:
          type: string
        packets_dropped_encoded:
          type: integer
          format: int64
        frames_sent:
          type: integer
          format: int64
        frames_dropped:
          type: integer
          format: int64
        fps_n:
          type: integer

    # ────────────────────────────────────────────────────────────────────────
    # Live input status
    # ────────────────────────────────────────────────────────────────────────

    LiveInputStatus:
      type: object
      additionalProperties: true
      description: |
        Snapshot LiveClip + nested per-input статуса. Возвращается
        `ChannelInstance::liveStatusJson()` (см. src/core/ChannelInstance.cpp:1189):
        массив элементов где `playlist_index` показывает позицию в
        playlist'е, а `input` — фактический per-driver shape.

        `state` — `Idle | WarmingUp | Live | Lost | Finished`.
        Все `*_ns` поля — наносекунды monotonic-clock.
      required:
        - id
        - state
        - loss_count
        - recovered_count
        - loss_detected_at_ns
        - last_packet_ns
        - duration_ns
        - warm_up_ns
        - loss_threshold_ns
        - playlist_index
      properties:
        id:
          type: string
          description: 'Playlist entry id (стабильный для SSE/badge mapping).'
        state:
          $ref: '#/components/schemas/LiveInputState'
        loss_count:
          type: integer
          format: int64
        recovered_count:
          type: integer
          format: int64
        loss_detected_at_ns:
          type: integer
          format: int64
          description: '0 если loss никогда не детектировался.'
        last_packet_ns:
          type: integer
          format: int64
          description: |
            Monotonic ns timestamp последнего полученного пакета;
            0 если ни одного ещё не было.
        duration_ns:
          type: integer
          format: int64
          description: |
            Из cfg — сколько играть. 0 = до loss/manual cut.
        warm_up_ns:
          type: integer
          format: int64
        loss_threshold_ns:
          type: integer
          format: int64
        playlist_index:
          type: integer
          description: 'Индекс этого LiveClip в текущем playlist snapshot.'
        input:
          $ref: '#/components/schemas/LiveInputInner'
          description: |
            Per-driver shape (RTSP/RTMP/Multicast/NDI). Эмитится только
            если LiveClip успел сконструировать input_; во время bring-up
            может отсутствовать.

    LiveInputInner:
      type: object
      additionalProperties: true
      description: |
        Per-driver диагностика для LiveInputClip. Discriminator — `type`.
        Поля помечены required только если соответствующая реализация
        эмитит их безусловно (см. src/clips/{Rtsp,Rtmp,Multicast,Ndi}Input.cpp).
      required: [type, packets_recv, reconnect_count, stalled, has_audio, prepared]
      properties:
        type:
          type: string
          enum: [rtsp, rtmp, multicast, ndi]
        packets_recv:
          type: integer
          format: int64
        reconnect_count:
          type: integer
        stalled:
          type: boolean
        has_audio:
          type: boolean
        prepared:
          type: boolean

        # ── RTSP-only ──
        url:
          type: string
          description: 'RTSP/NDI — sanitized URL.'
        transport:
          type: string
          description: 'RTSP — "tcp"|"udp".'
        connected:
          type: boolean
          description: 'RTSP-only.'
        bytes_recv:
          type: integer
          format: int64
          description: 'RTSP-only.'
        last_packet_age_ms:
          type: integer
          format: int64
          description: 'RTSP-only. -1 если пакет ещё не приходил.'

        # ── RTMP-only ──
        mode:
          type: string
          enum: [client, server]
          description: 'RTMP-only.'
        host:
          type: string
          description: 'RTMP — sanitized URL без stream-key.'
        buffer_ms:
          type: integer
          description: 'RTMP-only.'

        # ── Multicast-only ──
        address:
          type: string
        port:
          type: integer
        interface:
          type: string
        container:
          type: string
        jitter_buffer_ms:
          type: integer

        # ── NDI-only ──
        source_name:
          type: string
        groups:
          type: string
        low_bandwidth:
          type: boolean
        recv_name:
          type: string
        src_width:
          type: integer
        src_height:
          type: integer
        ndi_loaded:
          type: boolean
        ndi_version:
          type: string

    # ────────────────────────────────────────────────────────────────────────
    # Watcher
    # ────────────────────────────────────────────────────────────────────────

    WatcherStatus:
      type: object
      additionalProperties: true
      description: |
        Snapshot ContentSync — `ChannelInstance::watcherStatus()` возвращает
        либо `null` (если канал без content_sync), либо `ContentSync::statusJson()`
        с добавленным `channel_id` (см. src/content/ContentSync.cpp:127,
        src/core/ChannelInstance.cpp:1213).
      required:
        - channel_id
        - mode
        - source_path
        - scan_interval_ms
        - numa_node
        - current_backoff_ms
        - running
      properties:
        channel_id:
          type: integer
          format: int64
          description: 'Добавляется ChannelInstance поверх statusJson().'
        mode:
          type: string
          enum: [cache, passthrough]
          description: |
            `cache` — сканер копирует файлы на NUMA-локальную копию.
            `passthrough` — отдаёт share-путь напрямую без локального кэша.
            Backend другие значения НЕ эмитит (no `active`/`disabled`).
        source_path:
          type: string
          description: 'Корневой share-каталог (cfg.share_dir).'
        cache_path:
          type: string
          description: 'NUMA-локальный cache dir. Эмитится только при mode=cache.'
        scan_interval_ms:
          type: integer
          format: int64
        numa_node:
          type: integer
        current_backoff_ms:
          type: integer
          format: int64
          description: 'Текущий backoff между rescan; растёт при share-unreachable.'
        running:
          type: boolean
        last_share_ok_ns:
          type: integer
          format: int64
          description: |
            Эмитится только если у ContentSync есть metrics_; monotonic ns
            timestamp последнего успешного scan.
        share_unreachable_count:
          type: integer
          format: int64
          description: 'Cond — metrics_-pipeline only.'
        cache_files_count:
          type: integer
          format: int64
          description: 'Cond. В passthrough всегда 0.'
        cache_size_bytes:
          type: integer
          format: int64
          description: 'Cond. В passthrough всегда 0.'
        pending_deletes:
          type: integer
          format: int64
          description: 'Cond. Сколько файлов помечены к удалению, но ещё используются in-flight.'
        cache_copy_errors:
          type: integer
          format: int64
          description: 'Cond.'
        oversized_skipped:
          type: integer
          format: int64
          description: 'Cond. Сколько файлов пропустил кэш из-за size cap.'

    # ────────────────────────────────────────────────────────────────────────
    # Preview stats
    # ────────────────────────────────────────────────────────────────────────

    PreviewStats:
      type: object
      additionalProperties: true
      description: |
        Snapshot WebRTC-preview pipeline для одного канала
        (`PreviewManager::statsJson(channel_id)` —
        см. src/preview/PreviewManager.cpp:126). 200-OK эмитит все 5
        полей; если канал не имеет preview-pipeline — REST вернёт 404
        (а не объект без полей).
      required:
        - channel_id
        - encoder
        - sessions
        - started_at_unix
        - last_client_unix
      properties:
        channel_id:
          type: integer
          format: int64
        encoder:
          nullable: true
          description: |
            null если encoder ещё не сконструирован. Иначе три счётчика
            из `IPreviewEncoder` (см. PreviewManager.cpp:138-144).
          type: object
          required: [running, frames_encoded, bytes_emitted]
          properties:
            running:
              type: boolean
            frames_encoded:
              type: integer
              format: int64
            bytes_emitted:
              type: integer
              format: int64
        sessions:
          type: array
          description: |
            Per-session shape — `IPreviewSession::statsJson()`. Реализация
            libdatachannel отложена (fix23 follow-up); сейчас shape не
            стабилизирован и описан как additionalProperties: true.
          items:
            $ref: '#/components/schemas/PreviewSession'
        started_at_unix:
          type: integer
          format: int64
          description: |
            Когда канал стартовал preview pipeline. 0 если ни одного
            клиента ещё не было.
        last_client_unix:
          type: integer
          format: int64
          description: |
            Unix-секунды последней client activity. Используется для
            idle-shutdown logic.

    PreviewSession:
      type: object
      additionalProperties: true
      description: |
        Per-session preview status. Backend shape определяется реализацией
        `IPreviewSession::statsJson()`; libdatachannel-импл отложен в
        fix23 follow-up, поэтому поля не closed-set'ятся. UI обязан
        быть толерантен к unknown-полям.
      properties:
        session_id:
          type: string
        peer_addr:
          type: string
        bytes_sent:
          type: integer
          format: int64
        ice_state:
          type: string
          enum: [new, checking, connected, completed, failed, disconnected, closed]
        connected_at:
          $ref: '#/components/schemas/UnixTimestampMs'

    # ──────────────────────────────────────────────────────────────────────
    # Gateway schemas (fix18).
    # ──────────────────────────────────────────────────────────────────────

    GatewayConfig:
      type: object
      additionalProperties: true
      description: |
        Конфиг gateway. Парсится `parseGatewayCfg()`
        (src/gateway/GatewayCfg.cpp). REST `/api/gateways` принимает этот
        shape; `toJson(GatewayCfg)` отдаёт его обратно (defaults elided).

        Multi-input shape: Passthrough/Demux/Transcode используют единственный
        `input`. Remux принимает либо `input` (одиночный inputs[0]) +
        `extra_inputs`, либо массив `inputs[≥2]`. Парсер нормализует оба
        варианта.

        `mode` определяет, какой sub-cfg обязателен: `demux` для mode=demux,
        `remux` для mode=remux, `transcode` для mode=transcode. Для
        passthrough sub-cfg игнорируются.

        `fec` — orthogonal overlay; работает в любом режиме (Passthrough пока
        не поддерживается на backend, см. docs/FEC.md).
      required: [outputs]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: 'Human-readable label (поле опциональное в parser).'
        autostart:
          type: boolean
          default: false
          description: 'Поднимать gateway при старте core.'
        mode:
          $ref: '#/components/schemas/GatewayMode'
        input:
          $ref: '#/components/schemas/GatewayInputCfg'
          description: |
            Единственный input для Passthrough/Demux/Transcode, либо inputs[0]
            для Remux (при использовании input + extra_inputs формы).
        extra_inputs:
          type: array
          description: |
            inputs[1..] для Remux. Использовать только если `input` уже задан;
            иначе используйте `inputs` массив.
          items:
            $ref: '#/components/schemas/GatewayInputCfg'
        inputs:
          type: array
          minItems: 2
          description: |
            Альтернативная форма для Remux: ≥2 input-конфигов одним массивом.
            Парсер нормализует в (input, extra_inputs).
          items:
            $ref: '#/components/schemas/GatewayInputCfg'
        outputs:
          type: array
          minItems: 1
          description: |
            Один или несколько fan-out endpoints. Для Remux/Transcode — ровно 1
            output (single MPTS / single SPTS).
          items:
            $ref: '#/components/schemas/GatewayOutputCfg'
        demux:
          $ref: '#/components/schemas/DemuxCfg'
        remux:
          $ref: '#/components/schemas/RemuxCfg'
        transcode:
          $ref: '#/components/schemas/TranscodeCfg'
        fec:
          $ref: '#/components/schemas/FecCfg'

    GatewayMode:
      type: string
      enum: [passthrough, demux, remux, transcode]
      default: passthrough
      description: |
        Operating mode gateway'я (fix40):
          * `passthrough` — opaque UDP recv → sendto fan-out (fix18 wire).
          * `demux` — MPTS in → ≤N SPTS out, по `service_id` через DemuxRule.
          * `remux` — N SPTS in → 1 MPTS out, PID conflict resolution + PSI regen.
          * `transcode` — 1 SPTS in → 1 SPTS out, decode→re-encode V/A с
            freeze-frame / silence / fallback при потере входа.

    GatewayInputCfg:
      type: object
      additionalProperties: true
      description: |
        Source endpoint forwarder'а. Парсер allows either `interface_address`
        (IPv4) ИЛИ `interface` (NIC name) — см. parseInterface()
        в GatewayCfg.cpp.
      required: [address, port]
      properties:
        address:
          type: string
          description: 'IPv4 unicast/multicast address для bind.'
        port:
          type: integer
          minimum: 1
          maximum: 65535
        interface_address:
          type: string
          description: 'IPv4 — bind interface IP.'
        interface:
          type: string
          description: 'Имя NIC (eth0, lo, …) — см. /api/system/interfaces.'
        recv_buffer_kb:
          type: integer
          default: 1024
          description: 'SO_RCVBUF (KB).'

    GatewayOutputCfg:
      type: object
      additionalProperties: true
      description: "Один fan-out endpoint forwarder'а."
      required: [address, port]
      properties:
        id:
          type: string
          description: 'Optional stable id для логов/UI.'
        address:
          type: string
        port:
          type: integer
          minimum: 1
          maximum: 65535
        interface_address:
          type: string
        interface:
          type: string
        ttl:
          type: integer
          minimum: 1
          maximum: 255
          default: 16
        send_buffer_kb:
          type: integer
          default: 256

    GatewayEndpoint:
      description: |
        DEPRECATED. Сохранён для совместимости — не возвращается backend'ом.
        Используйте `GatewayInputCfg` / `GatewayOutputCfg`.
      allOf:
        - $ref: '#/components/schemas/GatewayInputCfg'

    StreamProbeRequest:
      type: object
      required: [address, port]
      properties:
        address:
          type: string
          description: IPv4 unicast или multicast.
          example: 239.1.2.3
        port:
          type: integer
          minimum: 1
          maximum: 65535
        interface_name:
          type: string
          description: NIC name (e.g. eth0). Alternative to interface_addr.
        interface_addr:
          type: string
          description: IPv4 of the NIC. Wins if both fields are set.
        duration_ms:
          type: integer
          default: 3000
          minimum: 200
          maximum: 10000
        recv_buffer_kb:
          type: integer
          default: 1024

    StreamProbeStream:
      type: object
      properties:
        pid:         { type: integer }
        stream_type: { type: integer }
        codec:       { type: string }
        language:    { type: string, description: ISO 639-2 lowercase or empty. }
        bitrate_bps: { type: integer, format: int64 }

    StreamProbeProgram:
      type: object
      properties:
        program_number: { type: integer }
        pmt_pid:        { type: integer }
        pcr_pid:        { type: integer }
        service_name:   { type: string }
        provider_name:  { type: string }
        streams:
          type: array
          items: { $ref: '#/components/schemas/StreamProbeStream' }

    StreamProbeResult:
      type: object
      properties:
        transport_stream_id: { type: integer }
        original_network_id: { type: integer }
        total_bitrate_bps:   { type: integer, format: int64 }
        bytes_received:      { type: integer, format: int64 }
        packets_received:    { type: integer, format: int64 }
        duration_ms:         { type: integer }
        programs:
          type: array
          items: { $ref: '#/components/schemas/StreamProbeProgram' }

    GatewayStatus:
      type: object
      additionalProperties: true
      description: |
        Snapshot одного gateway — `Gateway::statusJson()` /
        `DemuxGateway::statusJson()` / `RemuxGateway::statusJson()` /
        `TranscodeGateway::statusJson()`. Поля `mode`, `fec`, `demux`,
        `remux`, `transcode` появляются только когда соответствующий
        sub-cfg/overlay активен.
      required:
        - id
        - name
        - running
        - outputs
        - pkt_in
        - bytes_in
        - pkt_out
        - bytes_out
        - drops
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        running:
          type: boolean
          description: |
            true если io-thread сейчас крутится. Backend НЕ имеет state-
            машины с playing/failed; «failed» = stopped + last_error в логах.
        mode:
          $ref: '#/components/schemas/GatewayMode'
        input:
          $ref: '#/components/schemas/GatewayInputCfg'
          description: 'Зеркало `cfg_.input` через toJson(InputCfg). Для Remux может отсутствовать в пользу `inputs`.'
        inputs:
          type: array
          description: 'Multi-input shape для Remux (зеркало input + extra_inputs).'
          items:
            $ref: '#/components/schemas/GatewayInputCfg'
        outputs:
          type: array
          items:
            $ref: '#/components/schemas/GatewayOutputCfg'
        demux:
          $ref: '#/components/schemas/DemuxCfg'
        remux:
          $ref: '#/components/schemas/RemuxCfg'
        transcode:
          $ref: '#/components/schemas/TranscodeCfg'
        fec:
          $ref: '#/components/schemas/FecCfg'
        pkt_in:
          type: integer
          format: int64
        bytes_in:
          type: integer
          format: int64
        pkt_out:
          type: integer
          format: int64
        bytes_out:
          type: integer
          format: int64
        drops:
          type: integer
          format: int64
          description: "Сколько pakets'ов завернулись из-за sendto failure."

    DemuxRule:
      type: object
      additionalProperties: true
      description: |
        Одно правило demux-маршрутизации (fix40 A2). Привязывает service_id из
        входного MPTS к одному `output_id` из массива `outputs`. См.
        src/gateway/GatewayCfg.h:59 (struct DemuxRule).
      required: [service_id, output_id]
      properties:
        service_id:
          type: integer
          minimum: 0
          maximum: 65535
          description: 'PAT program_number входного MPTS, который перекладываем в этот output.'
        output_id:
          type: string
          description: |
            Стабильный sub-id outputs[i].id (manager-assigned, обычно
            "out0", "out1", …).
        preserve_eit:
          type: boolean
          default: true
          description: 'Транслировать EIT (EPG) для service_id.'
        preserve_subtitles:
          type: boolean
          default: true
          description: 'Транслировать subtitle ES (descriptor 0x59).'
        preserve_teletext:
          type: boolean
          default: true
          description: 'Транслировать teletext ES (descriptor 0x56).'
        pid_remap:
          type: array
          description: |
            Pin'ы input_pid → output_pid в SPTS. Пусто = preserve PIDs.
            Полезно для downstream-устройств с hard-coded PID assumptions.
          items:
            type: array
            minItems: 2
            maxItems: 2
            description: '[input_pid, output_pid] пара.'
            items:
              type: integer
              minimum: 0
              maximum: 8191

    DemuxCfg:
      type: object
      additionalProperties: false
      description: |
        Параметры режима demux. PSI emission периоды по ETSI TR 101 211 §4.4.
        См. src/gateway/GatewayCfg.h:75 (struct DemuxCfg).
      properties:
        routes:
          type: array
          description: 'Массив правил service_id → output_id.'
          items:
            $ref: '#/components/schemas/DemuxRule'
        emit_sdt:
          type: boolean
          default: true
        pat_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 100
        pmt_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 100
        sdt_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 2000

    PidRemapEntry:
      type: object
      additionalProperties: false
      required: [input_idx, src_pid, dst_pid]
      description: |
        Pin remux'а: PID `src_pid` из inputs[input_idx] → `dst_pid` в выходном
        MPTS. См. src/gateway/GatewayCfg.h:87 (struct PidRemapEntry).
      properties:
        input_idx:
          type: integer
          minimum: 0
          description: 'Индекс в массиве inputs (0..size-1).'
        src_pid:
          type: integer
          minimum: 0
          maximum: 8191
        dst_pid:
          type: integer
          minimum: 0
          maximum: 8191

    RemuxCfg:
      type: object
      additionalProperties: false
      description: |
        Параметры режима remux (N SPTS → 1 MPTS). См.
        src/gateway/GatewayCfg.h:105 (struct RemuxCfg).
      properties:
        pid_remap:
          type: array
          description: "Pinы PID-конфликтов между входами."
          items:
            $ref: '#/components/schemas/PidRemapEntry'
        target_bitrate_bps:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: '0 = no NULL stuffing; >0 = CBR pacing + NULL fill до target.'
        transport_stream_id:
          type: integer
          minimum: 0
          maximum: 65535
          default: 1
        original_network_id:
          type: integer
          minimum: 0
          maximum: 65535
          default: 1
        pat_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 100
        pmt_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 100
        sdt_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 2000
        emit_sdt:
          type: boolean
          default: true
        service_id_policy:
          type: string
          enum: [auto_renumber, reject]
          default: auto_renumber
          description: |
            Политика разрешения коллизий service_id между inputs.

    TranscodeCfg:
      type: object
      additionalProperties: false
      description: |
        Параметры режима transcode (1 SPTS → 1 SPTS, decode + re-encode V/A с
        loss-protection). См. src/gateway/GatewayCfg.h:144 (struct TranscodeCfg).
      properties:
        video_width:
          type: integer
          minimum: 1
          default: 1280
        video_height:
          type: integer
          minimum: 1
          default: 720
        video_fps:
          type: integer
          minimum: 1
          maximum: 240
          default: 25
        video_bitrate_bps:
          type: integer
          format: int64
          minimum: 1
          default: 4000000
        video_max_b_frames:
          type: integer
          minimum: 0
          maximum: 16
          default: 0
        video_preset:
          type: string
          default: medium
          description: 'libx264-style preset (ultrafast..placebo).'
        video_encoder_mode:
          type: string
          enum: [auto, cpu, x264, nvenc, qsv, vaapi]
          default: auto
        video_gpu_index:
          type: integer
          minimum: 0
          default: 0
        audio_bitrate_bps:
          type: integer
          format: int64
          minimum: 1
          default: 128000
        audio_sample_rate:
          type: integer
          enum: [44100, 48000]
          default: 48000
        audio_channels:
          type: integer
          enum: [1, 2]
          default: 2
        freeze_on_video_loss:
          type: boolean
          default: true
        silence_on_audio_loss:
          type: boolean
          default: true
        loss_grace_ms:
          type: integer
          format: int64
          minimum: 0
          default: 2000
          description: |
            После этого окна — переключение на fallback_logo_path (если задан).
        fallback_logo_path:
          type: string
          description: 'Optional путь к still-image; кодируется как freeze.'
        retry_backoff_ms_min:
          type: integer
          format: int64
          minimum: 1
          default: 200
        retry_backoff_ms_max:
          type: integer
          format: int64
          minimum: 1
          default: 5000
        transport_stream_id:
          type: integer
          minimum: 0
          maximum: 65535
          default: 1
        original_network_id:
          type: integer
          minimum: 0
          maximum: 65535
          default: 1
        service_id:
          type: integer
          minimum: 0
          maximum: 65535
          default: 1
        service_name:
          type: string
          default: Transcoded
        provider_name:
          type: string
          default: LiveQX
        pmt_pid:
          type: integer
          minimum: 0
          maximum: 8191
          default: 256
        video_pid:
          type: integer
          minimum: 0
          maximum: 8191
          default: 257
        audio_pid:
          type: integer
          minimum: 0
          maximum: 8191
          default: 258
        pcr_pid:
          type: integer
          minimum: 0
          maximum: 8191
          default: 0
          description: '0 = use video_pid.'
        pat_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 100
        pmt_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 100
        sdt_period_ms:
          type: integer
          minimum: 1
          maximum: 65535
          default: 2000
        emit_sdt:
          type: boolean
          default: true
        target_bitrate_bps:
          type: integer
          format: int64
          minimum: 0
          default: 0
          description: '0 = no CBR pacing; >0 → fix-A5 PCR-restamp + nanosleep_abs.'

    FecCfg:
      type: object
      additionalProperties: false
      description: |
        SMPTE 2022-1/-2 + Pro-MPEG COP3 r2 FEC overlay для gateway-output.
        См. docs/FEC.md и src/gateway/GatewayCfg.h:202 (struct FecCfg).
        Поля выводятся только когда отличаются от default'ов (пустой объект
        = "FEC disabled, defaults"). Поэтому `enabled` может отсутствовать
        в ответах GET, если FEC не включён.
      properties:
        enabled:
          type: boolean
          default: false
          description: |
            true → выход RTP+FEC; false → raw TS over UDP (legacy
            wire-format, default).
        mode:
          type: string
          enum: [1d, 2d]
          default: 1d
          description: |
            1d = column-only (SMPTE 2022-1); 2d = column + row (SMPTE 2022-2).
        L:
          type: integer
          minimum: 1
          maximum: 20
          default: 8
          description: 'Количество столбцов FEC-матрицы. L*D ≤ 100.'
        D:
          type: integer
          minimum: 4
          maximum: 20
          default: 8
          description: 'Количество строк FEC-матрицы. L*D ≤ 100.'
        ssrc:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295
          default: 0
          description: |
            RTP SSRC base. 0 → derive from steady_clock (production setups
            обычно оставляют 0).
        payload_type:
          type: integer
          minimum: 0
          maximum: 127
          default: 96
          description: 'RTP PT для FEC-пакетов (media RTP всегда PT=33 MP2T).'
        ts_per_rtp:
          type: integer
          minimum: 1
          maximum: 7
          default: 7
          description: 'Сколько TS-пакетов 188 байт паковать в один RTP (RFC 2250).'
        column_port_offset:
          type: integer
          minimum: 1
          default: 2
          description: 'FEC column UDP port = output port + offset.'
        row_port_offset:
          type: integer
          minimum: 1
          default: 4
          description: |
            FEC row UDP port = output port + offset (только для mode=2d).
            Должен отличаться от column_port_offset.
        media_rtp_emitted:
          type: integer
          format: int64
          readOnly: true
          description: 'Live counter — отдан только в GET статусе, не принимается в PATCH.'
        column_fec_emitted:
          type: integer
          format: int64
          readOnly: true
        row_fec_emitted:
          type: integer
          format: int64
          readOnly: true

    # ──────────────────────────────────────────────────────────────────────
    # System schemas.
    # ──────────────────────────────────────────────────────────────────────

    NetworkInterface:
      type: object
      additionalProperties: false
      description: |
        Один NIC хоста с активными адресами. Возвращается из
        `/api/system/interfaces` (см. src/utils/NetIfaces.cpp:26).
      required: [name, addresses, up, loopback, multicast]
      properties:
        name:
          type: string
          example: eth0
        addresses:
          type: array
          items:
            type: string
          description: |
            Список IPv4 на этом NIC'е. Backend фильтрует по AF_INET и
            IPv6-адреса НЕ возвращает.
        up:
          type: boolean
        loopback:
          type: boolean
        multicast:
          type: boolean
          description: 'IFF_MULTICAST flag.'

    GpuInfo:
      type: object
      additionalProperties: false
      description: |
        Per-backend двухслойный GPU encoder probe. Backend всегда эмитит
        ровно 4 фиксированных ключа (см. src/api/ControlApi.cpp:1316).
        Каждый имеет `built_in` (compile-time) и `codec_registered`
        (avcodec_find_encoder_by_name успешен в runtime).
      required: [nvenc, qsv, vaapi, x264]
      properties:
        nvenc:
          $ref: '#/components/schemas/GpuBackendProbe'
        qsv:
          $ref: '#/components/schemas/GpuBackendProbe'
        vaapi:
          $ref: '#/components/schemas/GpuBackendProbe'
        x264:
          $ref: '#/components/schemas/GpuBackendProbe'

    GpuBackendProbe:
      type: object
      additionalProperties: false
      required: [built_in, codec_registered]
      properties:
        built_in:
          type: boolean
        codec_registered:
          type: boolean

    TlsCertInfo:
      type: object
      additionalProperties: false
      description: |
        Метаданные одного X.509 сертификата (server или CA). Источник —
        `liveqx::tls::readCertInfo()` в src/utils/Tls.cpp.
        Все строки — UTF-8; `serial_hex` и `fingerprint_sha256` — uppercase
        hex (последний — colon-separated). `days_remaining` отрицательное,
        если cert уже истёк. SAN-IP включает и v4 и v6 адреса в одном массиве.
      required:
        - subject
        - issuer
        - serial_hex
        - fingerprint_sha256
        - signature_algorithm
        - public_key_algorithm
        - san_dns
        - san_ip
        - not_before_unix
        - not_after_unix
        - days_remaining
        - is_ca
        - self_signed
      properties:
        subject:                { type: string, example: 'CN=LiveQX,O=LiveQX' }
        issuer:                 { type: string, example: 'CN=LiveQX internal CA' }
        serial_hex:             { type: string, example: 'A4F1B2C9' }
        fingerprint_sha256:     { type: string, example: '7E:5A:...' }
        signature_algorithm:    { type: string, example: 'ecdsa-with-SHA256' }
        public_key_algorithm:   { type: string, example: 'id-ecPublicKey (P-256)' }
        san_dns:
          type: array
          items: { type: string }
        san_ip:
          type: array
          items: { type: string }
          description: 'IPv4 + IPv6 адреса в одном массиве.'
        not_before_unix:        { type: integer, format: int64 }
        not_after_unix:         { type: integer, format: int64 }
        days_remaining:         { type: integer, description: 'Отрицательное если cert истёк.' }
        is_ca:                  { type: boolean }
        self_signed:            { type: boolean }

    TlsInfo:
      type: object
      additionalProperties: false
      description: |
        Сводка состояния TLS из `/api/tls/info`. `server` и `ca` могут быть
        пустыми объектами (`{}`), если соответствующий cert отсутствует на
        диске — UI должен учитывать оба случая.
      required:
        - mode
        - tls_enabled
        - bind
        - san_extra
        - cert_path
        - key_path
        - tls_dir
        - server
        - ca
      properties:
        mode:
          type: string
          enum: [auto, provided, behind_proxy, disabled]
        tls_enabled:
          type: boolean
          description: 'true если listener сейчас слушает HTTPS, false если HTTP.'
        bind:
          type: string
          example: '0.0.0.0'
        san_extra:
          type: array
          items: { type: string }
          description: 'Доп. SAN-имена/IP из `config.tls.san_extra`.'
        cert_path: { type: string }
        key_path:  { type: string }
        tls_dir:   { type: string }
        server:
          oneOf:
            - $ref: '#/components/schemas/TlsCertInfo'
            - type: object
              additionalProperties: false
              description: 'Пустой объект если server.crt не найден или невалиден.'
        ca:
          oneOf:
            - $ref: '#/components/schemas/TlsCertInfo'
            - type: object
              additionalProperties: false
              description: 'Пустой объект если ca.crt не найден или режим без внутреннего CA.'

    TlsRegenerateResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - restart_required
        - fingerprint_sha256
        - not_after_unix
      properties:
        ok:                  { type: boolean, enum: [true] }
        restart_required:    { type: boolean, description: 'Всегда true; listener будет переподнят hot-reload`ом сразу после ответа.' }
        fingerprint_sha256:  { type: string }
        not_after_unix:      { type: integer, format: int64 }
        server:              { $ref: '#/components/schemas/TlsCertInfo' }

    TlsImportResponse:
      type: object
      additionalProperties: false
      required:
        - ok
        - restart_required
        - ca_imported
      properties:
        ok:                  { type: boolean, enum: [true] }
        restart_required:    { type: boolean, description: 'Всегда true; listener будет переподнят hot-reload`ом сразу после ответа.' }
        ca_imported:         { type: boolean, description: 'true если в запросе был указан CA и он успешно сохранён.' }
        fingerprint_sha256:  { type: string }
        not_after_unix:      { type: integer, format: int64 }
        server:              { $ref: '#/components/schemas/TlsCertInfo' }

    VersionInfo:
      type: object
      additionalProperties: false
      description: |
        Версия + compile-time feature flags. Источник правды:
        `MetricsCollector::renderVersion()` в src/api/MetricsCollector.cpp:506.
        Backend всегда эмитит все 7 полей (features — всегда полный объект
        с фиксированным набором ключей, attributions — массив, может быть пуст).
      required:
        - name
        - version
        - build_commit
        - build_time
        - build_type
        - features
        - attributions
      properties:
        name:
          type: string
          enum: [liveqx]
        version:
          type: string
          example: 1.0.0
        build_commit:
          type: string
        build_time:
          type: string
        build_type:
          type: string
          enum: [Debug, Release, RelWithDebInfo, MinSizeRel]
        features:
          $ref: '#/components/schemas/BuildFeatures'
        attributions:
          type: array
          description: |
            Лицензионные attributions от плагинов. UI показывает в About-диалоге.
            Массив всегда присутствует, может быть пуст.
          items:
            type: string

    BuildFeatures:
      type: object
      additionalProperties: false
      description: |
        Compile-time feature flags. Все ключи всегда присутствуют — backend
        эмитит true/false (или строку для `simd`) детерминированно по
        `#ifdef` (см. buildFeatures() в MetricsCollector.cpp:419).
      required:
        - gpu
        - nvenc
        - qsv
        - vaapi
        - systemd
        - ldap
        - smtp
        - simd
        - preview
        - sse
      properties:
        gpu:     { type: boolean }
        nvenc:   { type: boolean }
        qsv:     { type: boolean }
        vaapi:   { type: boolean }
        systemd: { type: boolean }
        ldap:    { type: boolean }
        smtp:    { type: boolean }
        simd:
          description: SIMD-режим бинаря; "scalar" если SIMD-флаг не задан.
          oneOf:
            - type: string
              enum: [scalar, avx2]
            - type: string
        preview: { type: boolean }
        sse:     { type: boolean, enum: [true] }

    SystemStatus:
      type: object
      additionalProperties: true
      description: |
        JSON snapshot, эквивалент `/api/status`. Возвращает
        `MetricsCollector::renderStatus()` (см. src/api/MetricsCollector.cpp:523).
        Каналы фильтруются по `ChannelScope` пользователя.
      required:
        - version
        - build_commit
        - build_time
        - uptime_seconds
        - process
        - channels
        - gateways
        - summary
      properties:
        version:
          type: string
        build_commit:
          type: string
        build_time:
          type: string
        uptime_seconds:
          type: integer
          format: int64
        process:
          type: object
          additionalProperties: true
          description: |
            ProcessMetrics — каждое поле эмитится только если значение
            >= 0 (т.е. читалось успешно из /proc).
          properties:
            rss_bytes:
              type: integer
              format: int64
            vsize_bytes:
              type: integer
              format: int64
            open_fds:
              type: integer
            threads:
              type: integer
            cpu_seconds_total:
              type: number
              format: double
        channels:
          type: array
          items:
            $ref: '#/components/schemas/SystemStatusChannel'
        gateways:
          type: array
          description: |
            Полный массив `GatewayManager::listJson()` (т.е. список
            `GatewayStatus`-объектов). Пустой массив если у пользователя нет
            cross-channel доступа.
          items:
            $ref: '#/components/schemas/GatewayStatus'
        summary:
          type: object
          additionalProperties: false
          required:
            - channels_total
            - channels_running
            - channels_failed
            - outputs_total
            - outputs_failed
            - gateways_total
            - gateways_running
          properties:
            channels_total:
              type: integer
            channels_running:
              type: integer
            channels_failed:
              type: integer
            outputs_total:
              type: integer
            outputs_failed:
              type: integer
            gateways_total:
              type: integer
            gateways_running:
              type: integer

    SystemStatusChannel:
      type: object
      additionalProperties: true
      description: |
        Per-channel snapshot внутри SystemStatus.channels[]. ВАЖНО:
        `state` — БИНАРНЫЙ enum (`running`/`stopped`), это НЕ полный
        `ChannelState`. Health-поля (health/fps/target_fps/rolling/etc)
        эмитятся ТОЛЬКО если у канала есть metrics+health pipeline.
      required: [id, name, state, outputs]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        state:
          type: string
          enum: [running, stopped]
        health:
          $ref: '#/components/schemas/HealthState'
        fps:
          type: number
        target_fps:
          type: number
        transition_active:
          type: boolean
        clip_changes_total:
          type: integer
          format: int64
        last_tick_age_seconds:
          type: number
          description: "-1.0 если канал ни разу не tick'нул."
        rolling:
          type: object
          additionalProperties: false
          properties:
            drops_10s:
              type: integer
              format: int64
            underruns_10s:
              type: integer
              format: int64
            rendered_10s:
              type: integer
              format: int64
        content_sync:
          type: object
          additionalProperties: false
          properties:
            files:
              type: integer
              format: int64
            size_bytes:
              type: integer
              format: int64
            share_unreachable_total:
              type: integer
              format: int64
            pending_deletes:
              type: integer
              format: int64
        outputs:
          type: array
          description: |
            Сжатый список outputs с counters; собирается из
            `ChannelInstance::outputsJson()` через ребрендинг полей
            (`type` берётся из `transport` ИЛИ `type`; `bytes_total` из
            `bytes_sent`; `drops_total` из `queue_drops`).
          items:
            type: object
            additionalProperties: true
            required: [id, type, healthy]
            properties:
              id:
                type: string
              type:
                type: string
                description: '"srt"|"rtmp"|"multicast"|"hls"|"ndi".'
              healthy:
                type: boolean
              bytes_total:
                type: integer
                format: int64
              drops_total:
                type: integer
                format: int64
              queue_bytes_used:
                type: integer
                format: int64
              queue_bytes_limit:
                type: integer
                format: int64

    # ──────────────────────────────────────────────────────────────────────
    # Plugin schemas (fix19).
    # ──────────────────────────────────────────────────────────────────────

    PluginListing:
      type: object
      additionalProperties: false
      description: |
        Один установленный плагин. Источник правды:
        `pluginListingJson()` в src/api/ControlApi.cpp:1355 — backend
        ВСЕГДА эмитит все 9 полей (без `if`/`contains`).
      required:
        - name
        - version
        - sha256
        - installed_at
        - forced
        - eula_accepted
        - pending_unload
        - output_drivers
        - input_drivers
      properties:
        name:
          type: string
        version:
          type: string
        sha256:
          type: string
          description: SHA-256 .so binary.
        installed_at:
          $ref: '#/components/schemas/UnixTimestamp'
        forced:
          type: boolean
          description: Установлен через force=true&i_understand=true.
        eula_accepted:
          type: boolean
        pending_unload:
          type: boolean
          description: |
            Помечен на uninstall, dlclose произойдёт при следующем рестарте core.
        output_drivers:
          type: array
          items:
            type: string
          description: |
            Имена IOutput-driver'ов, которые этот плагин зарегистрировал
            (например, `["ndi"]`).
        input_drivers:
          type: array
          items:
            type: string
          description: |
            Имена IInputClip-driver'ов, зарегистрированных плагином.

    # ──────────────────────────────────────────────────────────────────────
    # Stress schemas (fix26).
    # ──────────────────────────────────────────────────────────────────────

    StressConfig:
      type: object
      additionalProperties: false
      description: |
        Конфиг stress runner'а. Хранится в state.db, hot-reload через PUT.
        Источник правды: `StressConfig::toJson()` (src/stress/StressConfig.cpp:5).
      required:
        - enabled
        - schedule_cron
        - duration_sec
        - channels
        - channel_resolution
        - outputs_per_channel
        - scenarios
        - scenario_options
        - pass_criteria
        - report_dir
      properties:
        enabled:
          type: boolean
        schedule_cron:
          type: string
          description: |
            Cron-расписание (5-fields) для автозапуска. Пустая строка =
            только ручной запуск через /api/stress/start.
        duration_sec:
          type: integer
          minimum: 1
        channels:
          type: integer
          minimum: 0
          description: 'Сколько фейковых каналов поднимать.'
        channel_resolution:
          type: string
          description: '"WxHpFPS" / "WxH@FPS" / "720p25" — парсится `expectedFpsFor`.'
        outputs_per_channel:
          type: integer
          minimum: 0
        scenarios:
          type: array
          items:
            type: string
          description: |
            Список имён scenario'ев (free-form, не enum). Парсер принимает
            любые строки; неизвестные сценарии просто не запустятся.
        scenario_options:
          type: object
          additionalProperties: true
          description: 'Free-form per-scenario tuning.'
        pass_criteria:
          type: object
          additionalProperties: false
          required: [max_fps_drop_pct, max_memory_growth_pct_per_hour, max_crashes]
          properties:
            max_fps_drop_pct:
              type: number
              minimum: 0
            max_memory_growth_pct_per_hour:
              type: number
              minimum: 0
            max_crashes:
              type: integer
              minimum: 0
        report_dir:
          type: string

    StressStatus:
      type: object
      additionalProperties: false
      description: |
        Snapshot состояния stress сервиса. Возвращает
        `StressService::statusJson()` (src/stress/StressService.cpp:220).
      required:
        - enabled
        - schedule_cron
        - scheduler_armed
        - report_dir
        - last_report_id
        - runner
      properties:
        enabled:
          type: boolean
        schedule_cron:
          type: string
        scheduler_armed:
          type: boolean
          description: 'true если CronScheduler сейчас активен.'
        report_dir:
          type: string
        last_report_id:
          type: string
          description: 'ID последнего записанного отчёта или "" если ни одного.'
        runner:
          $ref: '#/components/schemas/StressRunnerStatus'

    StressRunnerStatus:
      type: object
      additionalProperties: false
      description: |
        Состояние одного StressRunner'а (см. src/stress/StressRunner.cpp:97).
      required: [state]
      properties:
        state:
          type: string
          enum: [idle, running]
        started_at_ms:
          type: integer
          format: int64
          description: 'Эмитится ТОЛЬКО когда state="running".'
        last_pass:
          type: boolean
          description: 'Эмитится только если был хотя бы один отчёт.'
        last_verdict:
          type: string
        last_ended_ms:
          type: integer
          format: int64

    StressReportSummary:
      type: object
      additionalProperties: false
      description: |
        Один элемент массива `/api/stress/reports`
        (см. src/stress/StressService.cpp:235).
      required: [id, started_at_ms, ended_at_ms, pass, verdict]
      properties:
        id:
          type: string
          description: 'YYYY-MM-DDTHH-MM-SSZ (либо с -N suffix при collision).'
        started_at_ms:
          type: integer
          format: int64
        ended_at_ms:
          type: integer
          format: int64
          description: '0 если отчёт без ended_at_ms (truncated/legacy).'
        pass:
          type: boolean
        verdict:
          type: string

    StressReport:
      type: object
      additionalProperties: false
      description: |
        Полный отчёт от GET /api/stress/reports/{id}. Возвращается as-is
        из state/stress/<id>.json (см. src/stress/StressReport.cpp:5,
        StressReportStore::read src/stress/StressReportStore.cpp:126).
      required:
        - started_at_ms
        - ended_at_ms
        - duration_sec
        - channels_requested
        - channels_started
        - channels_alive_at_end
        - crashes
        - per_channel
        - scenario_events
        - worst_fps_drop_pct
        - memory_growth_pct_per_hour
        - rss_kb_start
        - rss_kb_end
        - pass
        - verdict
        - fail_reasons
      properties:
        started_at_ms:
          type: integer
          format: int64
        ended_at_ms:
          type: integer
          format: int64
        duration_sec:
          type: integer
        channels_requested:
          type: integer
        channels_started:
          type: integer
        channels_alive_at_end:
          type: integer
        crashes:
          type: integer
        per_channel:
          type: array
          items:
            $ref: '#/components/schemas/StressPerChannel'
        scenario_events:
          type: array
          items:
            $ref: '#/components/schemas/StressScenarioEvent'
        worst_fps_drop_pct:
          type: number
        memory_growth_pct_per_hour:
          type: number
        rss_kb_start:
          type: integer
          format: int64
        rss_kb_end:
          type: integer
          format: int64
        pass:
          type: boolean
        verdict:
          type: string
        fail_reasons:
          type: array
          items:
            type: string

    StressPerChannel:
      type: object
      additionalProperties: false
      required:
        - id
        - frames_rendered
        - frames_dropped
        - actual_fps
        - expected_fps
        - fps_drop_pct
        - alive
      properties:
        id:
          type: string
        frames_rendered:
          type: integer
          format: int64
        frames_dropped:
          type: integer
          format: int64
        actual_fps:
          type: number
        expected_fps:
          type: number
        fps_drop_pct:
          type: number
        alive:
          type: boolean

    StressScenarioEvent:
      type: object
      additionalProperties: false
      required: [ts_ms, scenario, detail, ok]
      properties:
        ts_ms:
          type: integer
          format: int64
        scenario:
          type: string
        detail:
          type: string
        ok:
          type: boolean

    # ──────────────────────────────────────────────────────────────────────
    # Profiler schemas (fix26).
    # ──────────────────────────────────────────────────────────────────────

    ProfileMode:
      type: string
      enum: [off, sampling, instrumentation]
      description: |
        - `off`: только 1 atomic load на enter/leave (~1ns hot-path).
        - `sampling`: 1 atomic store на enter; гистограмма "какая стадия активна".
        - `instrumentation`: 2 clock_gettime + atomic_add на стадию; точные us'ы.

    ProfileSnapshot:
      type: object
      required: [mode, running, channel_id]
      properties:
        mode:
          $ref: '#/components/schemas/ProfileMode'
        running:
          type: boolean
          description: |
            Канал в running state. `false` + mode=`off` валидно для
            существующего, но stopped канала.
        channel_id:
          type: integer
        active_ms:
          type: integer
          format: int64
          description: Сколько ms канал провёл в non-Off режиме с reset'а.
        sampled_hits:
          $ref: '#/components/schemas/StageCounters'
        stage_us:
          $ref: '#/components/schemas/StageCounters'
        stage_count:
          $ref: '#/components/schemas/StageCounters'

    StageCounters:
      type: object
      description: Параллельный массив счётчиков по стадиям.
      properties:
        decode:
          type: integer
          format: int64
        compose:
          type: integer
          format: int64
        encode:
          type: integer
          format: int64
        output:
          type: integer
          format: int64
        total:
          type: integer
          format: int64
        none:
          type: integer
          format: int64

    # ──────────────────────────────────────────────────────────────────────
    # Storage mounts (fix41).
    # ──────────────────────────────────────────────────────────────────────

    MountCifsCreds:
      type: object
      required: [username]
      description: |
        CIFS-учётка. Plain-text `password` принимается только при создании
        и при rotate; в БД хранится в зашифрованном blob'е под master_key.
        Для guest-доступа достаточно `username="guest"` + пустого
        `password`. Для NFS sec=sys поле остаётся пустым.
      properties:
        username: { type: string, maxLength: 256 }
        password:
          type: string
          maxLength: 256
          description: |
            Plain-text. Опускайте при PUT-update'ах, чтобы оставить ранее
            сохранённый зашифрованный blob без изменений.
        domain:   { type: string, maxLength: 64 }

    # ── System Time (fix33) ────────────────────────────────────────────────
    TimeConfig:
      type: object
      required: [source, server_timezone, ntp, manual]
      properties:
        source:
          type: string
          enum: [ntp, system_local, manual]
          description: |
            Активный поставщик времени. `system_local` = ничего не делать,
            возвращать монотонный host clock. `manual` = host clock + сохранённый
            offset. `ntp` = SNTP-поллер, при недоступности fallback на
            system_local.
        server_timezone:
          type: string
          example: Europe/Moscow
          description: |
            Server-wide IANA timezone. Используется каналами, у которых
            channel_timezone=null (inherits_server_tz=true).
        ntp:
          type: object
          required: [enabled, servers, poll_interval_s, last_offset_ms, last_sync_at]
          properties:
            enabled:
              type: boolean
              description: 'Запустить background poller при source=ntp.'
            servers:
              type: array
              items: { type: string }
              description: 'Hostnames или IP, по одному на строку.'
            poll_interval_s:
              type: integer
              minimum: 16
              maximum: 4096
              description: 'Полл-период (sec). RFC 4330 рекомендует ≥16.'
            last_offset_ms:
              type: integer
              format: int64
              nullable: true
              description: 'Последнее измеренное смещение или null, если ещё не опрашивали.'
            last_sync_at:
              type: integer
              format: int64
              nullable: true
              description: "Unix-секунды последнего успешного poll'а, null если не было."
        manual:
          type: object
          required: [offset_ms, set_at]
          properties:
            offset_ms:
              type: integer
              format: int64
              description: 'Дельта относительно host clock. Положительное = впереди хоста.'
            set_at:
              type: integer
              format: int64
              nullable: true
              description: 'Когда последний раз вручную установлено, Unix-секунды.'

    TimeRuntime:
      type: object
      required: [source, offset_ms, effective_now, system_now, server_timezone]
      description: |
        Live snapshot — формируется на каждый GET и не персистится.
        `runtime.source` может расходиться с `config.source` (например, NTP
        не отвечает → fallback на system_local).
      properties:
        source:          { type: string }
        offset_ms:       { type: integer, format: int64 }
        effective_now:   { type: integer, format: int64, description: 'Unix-ms с учётом offset.' }
        system_now:      { type: integer, format: int64, description: 'Сырое значение host clock, Unix-ms.' }
        server_timezone: { type: string }

    TimeConfigResponse:
      type: object
      required: [config, runtime]
      properties:
        config:  { $ref: '#/components/schemas/TimeConfig' }
        runtime: { $ref: '#/components/schemas/TimeRuntime' }

    TimeConfigPatch:
      type: object
      description: |
        RFC 7396 merge-patch. Любое подмножество полей TimeConfig + удобная
        форма `manual.epoch_unix_ms` (backend вычислит offset_ms сам).
      properties:
        source:
          type: string
          enum: [ntp, system_local, manual]
        server_timezone:
          type: string
        ntp:
          type: object
          properties:
            enabled:         { type: boolean }
            servers:
              type: array
              items: { type: string }
            poll_interval_s: { type: integer, minimum: 16, maximum: 4096 }
        manual:
          type: object
          properties:
            offset_ms:
              type: integer
              format: int64
              description: 'Прямая запись offset.'
            epoch_unix_ms:
              type: integer
              format: int64
              description: |
                Удобная форма: оператор вводит "какое сейчас время", backend
                считает offset = epoch_unix_ms − system_now_ms.

    TimeProbeResult:
      type: object
      required: [server, ok]
      properties:
        server:         { type: string }
        ok:             { type: boolean }
        offset_ms:      { type: integer, format: int64, description: 'Заполняется, если ok=true.' }
        round_trip_ms:  { type: integer, format: int64, description: 'Заполняется, если ok=true.' }
        server_unix_ms: { type: integer, format: int64, description: 'Время сервера в момент ответа.' }
        error:          { type: string,  description: 'Заполняется, если ok=false.' }

    MountSpec:
      type: object
      required: [fs_type, source, target]
      description: |
        Заявка оператора на mount. Валидация на стороне backend'а
        (см. MountSpec::validate) запрещает newline / NUL / `;` / `|` /
        backtick в любом из строковых полей — этим текст безопасно
        попадает в текстовый systemd-юнит.
      properties:
        fs_type:
          type: string
          enum: [cifs, nfs]
        source:
          type: string
          description: |
            `//host/share` для CIFS, `host:/path` для NFS.
        target:
          type: string
          description: |
            Абсолютный путь под `/mnt/liveqx/<id>`. Должен быть
            уникальным в каталоге.
        options:
          type: string
          description: |
            Comma-separated mount opts (`vers=3.0,iocharset=utf8` для
            CIFS, `vers=4.1,proto=tcp` для NFS). Без `ro` — флаг
            переезжает в отдельное поле `ro`.
        ro:
          type: boolean
          default: true
        cifs:
          $ref: '#/components/schemas/MountCifsCreds'

    MountPublic:
      type: object
      required:
        [id, fs_type, source, target, options, ro, enabled, has_password,
         created_at, updated_at]
      description: |
        Публичная (без plain-text паролей) форма строки каталога.
        `active_state` обновляется background-sync'ом раз в 30s через
        `mountd::status()`; `last_status_at` — Unix-секунды последнего
        merge'а.
      properties:
        id:             { type: integer, format: int64 }
        fs_type:        { type: string, enum: [cifs, nfs] }
        source:         { type: string }
        target:         { type: string }
        options:        { type: string }
        ro:             { type: boolean }
        enabled:        { type: boolean }
        has_password:   { type: boolean }
        cifs_username:  { type: string }
        cifs_domain:    { type: string }
        created_at:     { type: integer, format: int64, description: 'Unix seconds.' }
        updated_at:     { type: integer, format: int64, description: 'Unix seconds.' }
        active_state:
          type: string
          description: |
            Last known systemd ActiveState — `active` / `activating` /
            `inactive` / `failed` / `deactivating`. Пустая строка =
            sync ещё не отрабатывал.
        last_status_at: { type: integer, format: int64 }

    MountError:
      type: object
      required: [error]
      description: |
        Стандартный error-shape для mounts CRUD. `error_code` — машинно-
        читаемая причина: `invalid` / `duplicate` / `not_found` /
        `crypto` / `db` / `rpc`.
      properties:
        error:      { type: string }
        error_code: { type: string }
        id:         { type: integer, format: int64, description: 'Echoed when known.' }

    MountTestResult:
      type: object
      required: [ok]
      description: |
        Результат `POST /api/system/mounts/test` — dry-run без записи
        в БД.
      properties:
        ok:            { type: boolean }
        helper_status: { type: string, description: 'systemd-style ActiveState as reported by mountd.' }
        error:         { type: string }

  # ──────────────────────────────────────────────────────────────────────────
  # Common parameters.
  # ──────────────────────────────────────────────────────────────────────────

  parameters:

    ChannelId:
      name: id
      in: path
      required: true
      description: Numeric channel id.
      schema:
        type: integer
        format: int64
        minimum: 1

    OutputId:
      name: output_id
      in: path
      required: true
      description: Stable per-channel output id (string).
      schema:
        type: string
        minLength: 1
        maxLength: 64

    UserId:
      name: user_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1

    LimitParam:
      name: limit
      in: query
      required: false
      description: |
        Максимальное число элементов. Дефолт endpoint-зависит (обычно 100,
        ceiling 1000).
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100

    OffsetParam:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0

    LastEventIdHeader:
      name: Last-Event-ID
      in: header
      required: false
      description: |
        Стандартный SSE re-attach header. Сервер реплеит события из
        ring-буфера (256 событий) с id > указанного. Если ring-буфер
        переполнился, реплея может быть неполным — клиент должен сделать
        full reload state'а.
      schema:
        type: integer
        format: int64
        minimum: 0

  # ──────────────────────────────────────────────────────────────────────────
  # Common responses.
  # ──────────────────────────────────────────────────────────────────────────

  responses:

    BadRequest:
      description: |
        Невалидный запрос: неправильный JSON, отсутствует обязательное поле,
        не прошла валидация.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: |
        Отсутствует/невалидный JWT, либо `password_change_required` (см. detail).
        UI должен попытаться refresh + redirect на логин при провале.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Forbidden:
      description: |
        Нет роли/per-channel grant'а на этот ресурс/действие.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Ресурс не существует или невидим текущему пользователю.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: |
        Состояние ресурса не позволяет операцию. Включает `requires_restart`
        (поля канала требуют рестарта) и `cannot_start`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Locked:
      description: |
        Учётка временно заблокирована brute-force lockout'ом.
        `detail` содержит unix timestamp до которого закрыто.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    PreconditionFailed:
      description: |
        Pre-condition not met: например, plugin SHA-256 не в allow-list,
        ABI mismatch.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    UnprocessableEntity:
      description: |
        Семантически невалидный input (валидный JSON, но логически неприемлем).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ServiceUnavailable:
      description: |
        Подсистема не сконфигурирована или сейчас недоступна. Известные коды:
        `metrics_collector_not_configured`, `events_bus_not_configured`,
        `preview_not_configured`, `gateways_not_configured`,
        `plugins_not_configured`, `stress_disabled`, `ldap_unavailable`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    InternalServerError:
      description: Unexpected server-side error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

# ─────────────────────────────────────────────────────────────────────────────
# webhooks: пока не используем (SSE заменяет push-нотификации к клиенту).
# ─────────────────────────────────────────────────────────────────────────────
